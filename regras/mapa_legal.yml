- id: FOLHA-DIA-5
  area: Município de Goiânia
  titulo: Folha paga até o dia 5 do mês seguinte
  tipo: prazo
  valor: 5
  unidade: dia do mês seguinte
  base: competência da folha
  norma: Lei Orgânica de Goiânia, art. 30
  fonte_dado:
  - folha do portal
  familia: PES
  gravidade: alta
  saldo_tolerado: 1.0
  justificativa: >-
    A folha de ativos e inativos é quitada até o dia 5 do mês seguinte. Salário ou provento
    liquidado e ainda não pago em dois fechamentos seguidos só existe se o pagamento passou do dia
    5; o saldo tolerado é um real (arredondamento). O dia exato só se confere com a folha publicada.
  base_do_limiar: Lei Orgânica, art. 30; MSC, contas 6.2.2.1.3.03 e .04 nas naturezas 3.1.90.01, 3.1.90.03 e 3.1.90.11.
