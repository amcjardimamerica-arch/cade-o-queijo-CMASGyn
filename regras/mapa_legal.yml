    A Lei Orgânica assegura o adicional por quinquênio, incorporável. O adicional é devido no mês em
    que o quinquênio se completa; não há carência a tolerar.
  base_do_limiar: Lei Orgânica de Goiânia, art. 28, VI e § 2º; folha com tempo de serviço.
  norma: Lei Orgânica, art. 28, VI e § 2º
  fonte_dado:
  - folha do portal
  familia: PES
  gravidade: alta
