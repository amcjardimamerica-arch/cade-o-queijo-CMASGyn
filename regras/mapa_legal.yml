- id: QUINQUENIO
  area: Município de Goiânia
  titulo: Adicional por quinquênio pago a cada cinco anos de serviço
  tipo: prazo
  valor: 5
  tolerancia_meses: 0
  unidade: anos de efetivo exercício por adicional
