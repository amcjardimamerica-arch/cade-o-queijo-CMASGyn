  familia: PES
  gravidade: media
- id: APOSENTADORIAS
  area: Pessoal, previdência e trabalho
  titulo: Aposentadorias pagas todo mês e iguais nas duas vias
  tipo: tolerancia
  valor: 1.0
  queda_mensal_maxima: 5.0
  meses_de_referencia: 6
  unidade: '% de diferença entre o RREO e a matriz'
  base: aposentadorias liquidadas no RREO Anexo 4 e na natureza 3.1.90.01 da matriz, mês a mês
  justificativa: >-
    As duas vias do mesmo valor precisam fechar em um por cento, como todo o resto. O provento é
    verba mensal de valor estável: a folha de inativos só cai de um mês para o outro por óbitos e
    revisões, que não chegam a um ponto percentual. Cinco por cento abaixo da mediana dos seis meses
    anteriores é atraso ou retenção até prova em contrário.
  base_do_limiar: RREO Anexo 4 e MSC natureza 3.1.90.01; CF, art. 40, § 8º e Lei 9.717/1998.
  norma: CF, art. 40, § 8º e Lei 9.717/1998; Lei Orgânica, art. 30
  fonte_dado:
  - RREO Anexo 4
  - MSC
  familia: PES
  gravidade: critica
- id: FGTS-DIA-20
  area: Pessoal, previdência e trabalho
  titulo: FGTS e contribuições patronais recolhidos até o dia 20
  tipo: prazo
  valor: 20
  saldo_tolerado: 1.0
  unidade: dia do mês seguinte
  base: obrigações patronais liquidadas no mês (natureza 3.1.90.13)
  justificativa: >-
    O depósito vence no dia 20 do mês seguinte. Saldo liquidado e não pago em dois fechamentos
