  - quadro de servidores
  familia: VIN
  gravidade: critica
- id: CONTROLE-INTERNO
  area: Município de Goiânia
  titulo: Controle interno comunica as irregularidades ao Tribunal de Contas
  tipo: prazo
  valor: 0
  unidade: dias entre conhecer a irregularidade e dar ciência ao Tribunal
  base: indícios confirmados em duas vias e comunicações do controle interno ao Tribunal
  justificativa: >-
    A Constituição manda o controle interno dar ciência da irregularidade ao Tribunal ao tomar
    conhecimento dela (CF, art. 74, § 1º), sob pena de responsabilidade solidária; não há prazo a
    tolerar. Sem as comunicações publicadas, cada indício confirmado vira pedido de acesso.
  base_do_limiar: Lei Orgânica de Goiânia, art. 104; CF, art. 74, § 1º; fichas confirmadas do parecer.
  norma: Lei Orgânica, art. 104; CF, art. 74, § 1º
  fonte_dado:
  - comunicações da Controladoria ao Tribunal de Contas dos Municípios
  familia: CTA
  gravidade: alta
- id: JETON
  area: Pessoal, previdência e trabalho
  titulo: Jeton da JARI e do CADEP dentro do valor e do número de sessões da lei
