  base_do_limiar: LC 312/2018 e LC 336/2021; MSC natureza 3.1.91.13 (patronal intraorçamentária ao RPPS).
- id: FIM-DE-MANDATO-PESSOAL
  area: Orçamento e responsabilidade fiscal
  titulo: Sem aumento de pessoal nos 180 dias finais
  tipo: prazo
  valor: 180
  unidade: dias antes do fim do mandato
  base: atos de pessoal
  norma: LC 101/2000, art. 21
  fonte_dado:
  - Diário Oficial
  - RGF
  familia: PISO
  gravidade: critica
  aumento_maximo: 0.0
  justificativa: >-
    É nulo o ato de que resulte aumento da despesa com pessoal nos 180 dias anteriores ao fim do
    mandato. O corte é zero: a média mensal da despesa bruta de julho a novembro do último ano não
    pode passar da média de janeiro a junho (dezembro fica fora por causa do décimo terceiro).
  base_do_limiar: LC 101/2000, art. 21, II; RGF Anexo 1, despesa bruta mês a mês do 3º quadrimestre.
