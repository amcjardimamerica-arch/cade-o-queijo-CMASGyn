# Mapa legal do Onisciente.
# Cada regra tem norma, parâmetro testável, fonte do dado e família de indício.
# Uma regra sem número não vira indício: vira pergunta no ofício.
# As normas vêm do catálogo levantado em 26/11/2026 (ctresb/leis e Sileg).
versao: '2026-11-27'
fonte_de_leis:
  repositorio: https://github.com/ctresb/leis
  base_url: https://github.com/ctresb/leis/blob/main/
  nota: Cada norma aponta para o arquivo dela; o motor confere o campo revogada antes de usar a regra.
sileg:
  padrao: https://www.goiania.go.gov.br/html/gabinete_civil/sileg/dados/legis/{ano}/{tipo}_{data}_{numero:09d}.html
  tipos:
    lo: lei ordinária
    lc: lei complementar
    dc: decreto
areas:   # as nove áreas do direito; toda regra e toda norma cabem numa delas
- Orçamento e responsabilidade fiscal
- Licitações, contratos e parcerias
- Pessoal, previdência e trabalho
- Penal e improbidade
- Transparência e acesso à informação
- Tributária
- Controle externo
- Município de Goiânia
- Qualidade
