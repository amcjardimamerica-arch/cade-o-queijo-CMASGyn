# --- Regras da Frente C (2026-11-27) ------------------------------------------------
# Limiares restritivos: o mais exigente que a lei e os dados sustentam. Cada limiar traz a
# justificativa e a base (de onde vêm a lei e o dado). No parecer, alerta é indício, não acusação.
- id: ACAO-GENERICA
  area: Orçamento e responsabilidade fiscal
  titulo: Gasto finalístico classificado como administração geral
  tipo: maximo
  valor: 10.0
  unidade: '% do liquidado da função'
  base: liquidado da função na subfunção 122 (Administração Geral), funções finalísticas
  funcoes_meio: ['01', '02', '03', '04', '28']
  justificativa: >-
    A lei não fixa percentual. Dez por cento é o menor corte que ainda comporta o custeio
    administrativo próprio de uma função (sede, gestão, apoio); acima dele a dotação deixa de dizer
    onde o dinheiro chega e o destino pode mudar dentro da mesma ação, sem a autorização legislativa
    que a Constituição exige para remanejar.
  base_do_limiar: Matriz de saldos contábeis (função e subfunção de cada empenho) e RREO Anexo 2, duas vias.
  norma: CF, art. 167, V e VI; LC 101/2000, arts. 48 e 48-A
  fonte_dado:
  - MSC
  - RREO Anexo 2
  familia: ORC
  gravidade: media
- id: RP-NUNCA-LIQUIDADOS
  area: Orçamento e responsabilidade fiscal
  titulo: Restos a pagar não processados cancelados sem liquidar ou parados há mais de um exercício
  tipo: maximo
  valor: 10.0
  idade_maxima_exercicios: 1
  saldo_tolerado: 1.0
  unidade: '% dos restos a pagar não processados inscritos'
  base: restos a pagar não processados inscritos no fim do exercício anterior
  justificativa: >-
    O empenho reserva dotação para uma obrigação a cumprir (Lei 4.320/1964, art. 58) e o resto a
    pagar é a despesa empenhada e não paga até 31 de dezembro (art. 36). O que é inscrito e depois
    cancelado sem liquidar nunca virou entrega. A lei não fixa percentual: dez por cento admite a
    sobra natural de contratos que mudaram; acima disso a inscrição deixa de ser exceção. O resto não
    processado que atravessa um exercício inteiro sem liquidação não tem entrega a esperar; o corte é
    um exercício e o saldo tolerado é um real (arredondamento).
  base_do_limiar: RREO Anexo 14 (inscrição, cancelamento, pagamento) e MSC contas 6.3.1.1 e 6.3.1.9.9 por ano de inscrição.
  norma: Lei 4.320/1964, arts. 36 e 58 a 65
  fonte_dado:
  - RREO Anexo 14
  - MSC
  familia: ENT
  gravidade: alta
- id: CUSTO-FIXO-SEM-ADITIVO
  area: Licitações, contratos e parcerias
  titulo: Valor de contrato que muda além do que o termo publicado declara
  tipo: tolerancia
  valor: 1.0
  unidade: R$ de diferença
  base: valor inicial, valor global atual e valores declarados em cada termo publicado no PNCP
  justificativa: >-
    O valor de um contrato só muda por termo aditivo ou apostila (Lei 14.133/2021, arts. 124, 125 e
    136), e o que muda só tem eficácia publicado no PNCP (art. 94). Qualquer diferença acima de um
    real entre o valor que o termo declara e o valor global que passa a valer é mudança sem
    instrumento; um real absorve só o arredondamento de centavos. Prorrogação de vigência sem valor
    publicado é custo que continua sem número.
  base_do_limiar: PNCP, contratos (valor inicial e global) e termos (valor acrescido, valor global, vigência).
  norma: Lei 14.133/2021, arts. 94, 124, 125 e 136
  fonte_dado:
  - PNCP
  familia: PRC
  gravidade: alta
- id: FIM-DE-MANDATO-CAIXA
  area: Orçamento e responsabilidade fiscal
  titulo: Caixa suficiente para as obrigações do fim do mandato
  tipo: minimo
  valor: 0.0
  unidade: R$ de disponibilidade de caixa líquida após os restos a pagar, em cada destinação
  base: RGF Anexo 5 do 3º quadrimestre do último ano do mandato
  justificativa: >-
    O art. 42 veda contrair, nos dois últimos quadrimestres, obrigação sem caixa para pagá-la. O
    corte é zero em cada destinação e não no total, porque o caixa de uma vinculação não paga a
    despesa de outra.
  base_do_limiar: RGF Anexo 5, disponibilidade de caixa líquida após a inscrição dos restos a pagar não processados.
  norma: LC 101/2000, art. 42
  fonte_dado:
  - RGF Anexo 5
  familia: PISO
  gravidade: critica
