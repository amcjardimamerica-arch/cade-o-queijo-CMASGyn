# Matriz do Programa Nacional de Transparência Pública (PNTP), ciclo 2026, guardada como dado versionado.
# Lida em 27/11/2026 nas fontes abaixo. Os critérios estão resumidos com palavras do Onisciente (a redação oficial
# fica no documento da Atricon); número, dimensão e classificação seguem a matriz. Nada aqui é inventado: onde a
# fonte não trouxe o dado, o campo diz a origem (``classificacao_origem``, ``base_legal_origem``, ``itens_origem``)
# e a pendência fica listada em ``pendencias``.
ciclo: 2026
programa: Programa Nacional de Transparência Pública (PNTP)
coordenacao: Atricon, com o TCU e o TCE-MT; os Tribunais de Contas validam os seus jurisdicionados (Goiânia, TCM-GO)
lida_em: '2026-11-27'
completa: false
fontes:
  - id: cartilha_2026
    titulo: Cartilha PNTP 2026, 4ª edição, versão de 08/04/2026 (Atricon)
    url: https://www.mpma.mp.br/wp-content/uploads/2026/04/Cartilha-PNTP-2026-versao-08.04.2026.pdf
    hospedagem: cópia publicada pelo Ministério Público do Maranhão; o original fica no sítio da Atricon
    lida_em: '2026-11-27'
    trouxe: pesos de exigibilidade, pesos dos itens de verificação, pesos das dimensões (Tabela 2), faixas dos níveis
      e regra dos essenciais, totais por matriz (Tabela 1), lista e numeração dos critérios das dimensões 1 a 19,
      atualidade de até 30 dias e série histórica de 3 anos, gravação de relatórios não obrigatória no ciclo
    nao_trouxe: as páginas de detalhamento de cada critério (classificação, fundamentação e itens aplicáveis) não
      saíram no texto extraído do PDF, que tem 91.421 caracteres
  - id: matriz_2026
    titulo: Matriz de Critérios 2026 (planilha do PNTP em PDF)
    url: https://sistema.pelotas.com.br/transparencia/arquivos/Matriz de Criterios 2026 PDF.pdf
    hospedagem: cópia publicada pela Prefeitura de Pelotas (jurisdicionado), não por tribunal
    lida_em: '2026-11-27'
    trouxe: classificação essencial ou recomendada de cada critério e os totais por matriz; colunas dos itens com o
      cabeçalho e a exigência de link com evidência para cada resposta Sim
    nao_trouxe: as marcações de item aplicável por critério, desalinhadas na extração do texto
  - id: metodologia_tcepi_2026
    titulo: Orientações aos jurisdicionados, PNTP 2026 (TCE-PI, Secretaria de Controle Externo)
    url: https://www.tcepi.tc.br/wp-content/uploads/2026/04/Metodologia-PNTP-2026.pdf
    lida_em: '2026-11-27'
    trouxe: lista dos oito níveis, cinco itens de verificação, matrizes por Poder, alterações do ciclo 2026 e prazos
  - id: treinamento_tcepi_2026
    titulo: Treinamento PNTP 2026 (TCE-PI)
    url: https://www.tcepi.tc.br/wp-content/uploads/2026/04/PNTP-2026-TREINAMENTO.pdf
    lida_em: '2026-11-27'
    trouxe: o critério 4.3 passou de obrigatório a essencial; 16.1 e 16.2 passaram a obrigatórios (LC 224/2025);
      17.1 a 17.3 obrigatórios
  - id: cronograma_2026
    titulo: Cronograma PNTP 2026 (Atricon)
    url: https://cdn.atricon.org.br/uploads/2026/02/Cronograma-PNTP-2026.pdf
    lida_em: '2026-11-27'
    trouxe: autoavaliação de 20/04 a 29/05/2026, validação pelos tribunais de 01/06 a 10/08/2026, garantia da
      qualidade amostral de 31/08 a 09/10/2026, consolidação até 10/11/2026, resultado em novembro de 2026
  - id: cartilha_2025
    titulo: Cartilha PNTP 2025 (Atricon), cópia do TCE-SP
    url: https://tce.sp.gov.br/sites/default/files/publicacoes/Cartilha%20PNTP%202025.pdf
    lida_em: '2026-11-27'
    trouxe: mesmos pesos e mesma regra do Diamante no ciclo 2025; totais do ciclo 2025 (ver matriz_2025.yml)
  - id: radar
    titulo: Radar da Transparência Pública (Atricon), painel 1
    url: https://radardatransparencia.atricon.org.br/
    lida_em: '2026-11-27'
    trouxe: só o painel nacional agregado; o painel 6 (avaliação por entidade) e os dados abertos do PNTP recusaram a
      leitura (erro do sítio) e ficam para a sondagem no GitHub (chave e_radar)
metodologia:
  pesos_exigibilidade: {essencial: 2.0, obrigatorio: 1.5, recomendado: 1.0}
  itens: {disponibilidade: 0.30, atualidade: 0.30, serie_historica: 0.20, gravacao: 0.10, filtro: 0.10}
  item_nao_aplicavel: o percentual do item que não se aplica ao critério é redistribuído proporcionalmente entre os
    demais itens do mesmo critério
  soma_da_dimensao: a soma das pontuações máximas dos critérios de uma dimensão é igual ao peso da dimensão; dentro
    dela cada critério vale na proporção do seu peso de exigibilidade
  formula: indice = 100 x soma_d[ peso_d x soma_c(e_c x f_c) / soma_c(e_c) ] / soma_d(peso_d), em que e_c é o peso
    de exigibilidade, f_c a fração atendida do critério pelos itens aplicáveis e d percorre as dimensões com
    critério aplicável ao ente
  atualidade_dias: 30
  serie_historica_anos: 3
  gravacao_obrigatoria_no_ciclo: false
  evidencia: cada resposta Sim exige o link com a evidência (cabeçalho da matriz de critérios)
  faixas:
    - {nivel: Diamante, minimo: 95.0, maximo: 100.0, exige_essenciais: true, selo: true}
    - {nivel: Ouro, minimo: 85.0, maximo: 95.0, exige_essenciais: true, selo: true}
    - {nivel: Prata, minimo: 75.0, maximo: 85.0, exige_essenciais: true, selo: true}
    - {nivel: Elevado, minimo: 75.0, maximo: 100.0, exige_essenciais: false, selo: false}
    - {nivel: Intermediário, minimo: 50.0, maximo: 75.0, exige_essenciais: false, selo: false}
    - {nivel: Básico, minimo: 30.0, maximo: 50.0, exige_essenciais: false, selo: false}
    - {nivel: Inicial, minimo: 0.01, maximo: 30.0, exige_essenciais: false, selo: false}
    - {nivel: Inexistente, minimo: 0.0, maximo: 0.01, exige_essenciais: false, selo: false}
  regra_essenciais: os níveis Diamante, Ouro e Prata exigem 100% dos critérios essenciais; com um ou mais essenciais
    não atendidos o ente perde a certificação mesmo com índice de 75% ou mais e fica no nível Elevado
dimensoes:
  1: {nome: Informações Prioritárias, peso: 2}
  2: {nome: Informações Institucionais, peso: 2}
  3: {nome: Receita, peso: 4}
  4: {nome: Despesa, peso: 4}
  5: {nome: Convênios e Transferências, peso: 1}
  6: {nome: Recursos Humanos, peso: 3}
  7: {nome: Diárias, peso: 1}
  8: {nome: Licitações, peso: 3}
  9: {nome: Contratos, peso: 3}
  10: {nome: Obras, peso: 2}
  11: {nome: Planejamento e Prestação de Contas, peso: 4}
  12: {nome: Serviço de Informação ao Cidadão, peso: 2}
  13: {nome: Acessibilidade, peso: 1}
  14: {nome: Ouvidoria, peso: 1}
  15: {nome: LGPD e Governo Digital, peso: 1}
  16: {nome: Renúncia de Receita, peso: 1}
  17: {nome: Emendas Parlamentares, peso: 1}
  18: {nome: Saúde, peso: 1}
  19: {nome: Educação e Assistência Social, peso: 1}
# Matrizes que valem para a Prefeitura (Poder Executivo municipal): comum, executivo e executivo_consorcios.
matrizes_do_executivo: [comum, executivo, executivo_consorcios]
totais_oficiais:
  comum: {total: 72, essencial: 7, obrigatorio: 53, recomendado: 12}
  executivo: {total: 23, essencial: 4, obrigatorio: 12, recomendado: 7}
  executivo_consorcios: {total: 1, essencial: 1, obrigatorio: 0, recomendado: 0}
pendencias:
  - A Tabela 1 da cartilha dá 53 obrigatórios na matriz comum; a numeração das dimensões 1 a 15, menos os critérios
    de estatais e consórcios, dá 54. Um dos critérios marcados abaixo como obrigatório da matriz comum pertence a
    outra matriz. A planilha oficial com as colunas alinhadas resolve (sondagem e_metodo). Até lá o avaliador
    usa os 97 critérios, o que muda o índice em menos de 0,3 ponto.
  - As marcações de item aplicável por critério (que itens contam em cada um) não saíram na extração; o campo
    ``itens`` de cada critério é a leitura do Onisciente pela natureza do dado e está marcado com itens_origem.
  - A fundamentação legal individual de cada critério não saiu na extração; o campo base_legal é do Onisciente,
    conferido no corpus do repositório quando o texto está lá (Lei 12.527, LC 101, Lei 14.133, Lei 13.019, LOAS).
  - O índice e o nível de Goiânia no Radar (painel 6) não abriram nesta leitura.
# Origem da classificação: os essenciais e os recomendados foram lidos um a um na matriz_2026 (12 essenciais e 19
# recomendados nas matrizes da Prefeitura, iguais aos totais oficiais); os obrigatórios são os demais, como a própria
# matriz diz, e 16.1, 16.2 e 17.1 a 17.3 também estão confirmados no treinamento do TCE-PI.
classificacao_origem: {essencial: matriz_2026, recomendado: matriz_2026, obrigatorio: os demais critérios da matriz_2026}
itens_origem: onisciente (leitura pela natureza do dado; ver pendências)
base_legal_origem: onisciente (artigos conferidos no corpus quando o texto está no repositório)
# Itens: D disponibilidade, A atualidade, S série histórica, G gravação, F filtro.
# termos: grupos de palavras (sem acento, minúsculas); o critério é localizado quando todos os grupos aparecem
# numa mesma página lida, bastando uma palavra de cada grupo.
