[project]
name = "onisciente"
version = "0.1.0"
description = "A trilha do dinheiro público, da origem à prestação de contas. Evolução do Cadê o Queijo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
testes = ["pytest>=8"]

[project.scripts]
onisciente = "onisciente.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["onisciente*"]

[tool.pytest.ini_options]
testpaths = ["testes"]
python_files = ["test_*.py"]
addopts = "-q"
