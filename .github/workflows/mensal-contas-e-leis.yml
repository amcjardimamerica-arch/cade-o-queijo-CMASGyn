name: Mensal — contas e legislação
on:
  schedule: [{cron: "0 7 1 * *"}]   # dia 1º, 04h em Goiânia
  workflow_dispatch:
permissions: {contents: write, issues: write}
concurrency: {group: vigilancia, cancel-in-progress: false}
jobs:
  legislacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install --quiet -r requirements.txt
      - name: Rebaixar corpus legal
        run: python src/corpus_build.py
      - name: Capturar resoluções novas do Conselho Nacional
        run: python scripts/captura_cnas.py 2026 || true
      - name: Recalcular critérios extraídos das normas
        run: python src/qualidade.py --reconstruir || python src/qualidade.py
      - name: Publicar corpus
        run: |
          git config user.name "vigilancia-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A corpus corpus_txt config dados || true
          git diff --staged --quiet || git commit -m "corpus legal $(date +%Y-%m)"
          git push

  contas:
    needs: legislacao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm}
      - run: pip install --quiet -r requirements.txt && npm install --silent
      - name: Cache dos repasses federais
        uses: actions/cache@v4
        with: {path: estado/fnas, key: "fnas-${{ github.run_month }}-v1", restore-keys: fnas-}
      - name: Fiscalização completa
        env:
          ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
          URL_TRANSPARENCIA: "${{ secrets.URL_TRANSPARENCIA || vars.URL_TRANSPARENCIA }}"
        run: python src/run_fiscalizacao.py | tee /tmp/saida.txt
      - name: Publicar
        run: |
          git config user.name "vigilancia-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A dados docs relatorios estado || true
          git diff --staged --quiet || git commit -m "contas $(date -d 'last month' +%Y-%m)"
          git push
      - name: Abrir apontamento quando houver irregularidade
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const d=JSON.parse(fs.readFileSync('relatorios/achados_consolidados_2026.json','utf8'));
            if(!d.total) return;
            let dup=null; try{dup=JSON.parse(fs.readFileSync('relatorios/dupla_etapa_2026.json','utf8'));}catch(e){}
            const s=d.por_severidade||{};
            await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,
              title:`Contas ${new Date().toISOString().slice(0,7)} — ${d.total} apontamentos (${s.critica||0} criticos)`,
              body:[`**${d.total} achados** — ${s.critica||0} criticos, ${s.alta||0} altos, ${s.media||0} medios.`,'',
               dup?`**Dupla etapa:** ${dup.acionados} acionados, ${dup.convergiram} convergiram, ${dup.divergiram} divergiram.`:'',
               '',`${d.documentos_requisitados} documentos a requisitar.`,'',
               'Parecer: `relatorios/Parecer_Fiscalizacao_2026.docx`',
               'Fluxograma: `docs/fluxograma_2026.html`','',
               'Nada aqui e peca processual sem revisao do advogado, artigo 32 da Lei 8.906/1994.'
              ].filter(Boolean).join('\n')});
