name: Publicar painel

# Fluxo leve, sem grupo de concorrência: publica docs/ no GitHub Pages.
# Roda sempre que o painel muda, e pode ser acionado à mão a qualquer momento.

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

concurrency: {group: painel, cancel-in-progress: false}
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: deploy
        uses: actions/deploy-pages@v4
      - run: |
          echo "## Painel publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
