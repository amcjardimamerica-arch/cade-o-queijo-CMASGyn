name: Corpus normativo mensal

on:
  schedule:
    - cron: "0 7 1 * *"      # dia 1º de cada mês
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ocrmypdf tesseract-ocr-por ghostscript
          pip install -q -r requirements.txt

      - name: Consolidar o corpus de leis
        run: python src/corpus_build.py

      - name: Recalcular os critérios de qualidade
        run: python src/qualidade.py --reconstruir

      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "corpus: consolidação mensal"
          branch: corpus/atualizacao-automatica
          delete-branch: true
          title: "Corpus normativo — consolidação mensal"
          body: |
            Atualização automática do repositório de leis. **Revise antes de aceitar**:
            a alteração do corpus muda a base de toda análise subsequente.

            - `corpus/manifesto.json` — índice, hashes e contagem
            - `relatorios/corpus_pendencias.md` — normas não incorporadas
            - `dados/criterios_qualidade.json` — critérios recalculados
          labels: corpus
