name: Retomada após renovação do limite

on:
  schedule:
    # De hora em hora. O roteiro decide sozinho se já é hora de retomar.
    - cron: "35 * * * *"
  workflow_dispatch:

concurrency:
  group: vigilancia-diaria
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retomar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Há fila pendente e a janela já renovou?
        id: checar
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, datetime
          fila = pathlib.Path("estado/fila_pendente.jsonl")
          alvo = pathlib.Path("estado/retomar_em.json")
          if not fila.exists() or fila.stat().st_size == 0:
              print("prosseguir=nao"); raise SystemExit
          if alvo.exists():
              q = json.loads(alvo.read_text())
              t = datetime.datetime.fromisoformat(q["retomar_em"])
              if datetime.datetime.now(datetime.timezone.utc) < t:
                  print("prosseguir=nao"); raise SystemExit
          print("prosseguir=sim")
          PY

      - uses: actions/setup-python@v5
        if: steps.checar.outputs.prosseguir == 'sim'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt
        if: steps.checar.outputs.prosseguir == 'sim'

      - name: Drenar a fila
        if: steps.checar.outputs.prosseguir == 'sim'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMITE_TOKENS_JANELA: ${{ vars.LIMITE_TOKENS_JANELA }}
        run: python src/run_fila.py

      - name: Persistir
        if: steps.checar.outputs.prosseguir == 'sim'
        run: |
          git config user.name "vigilancia-bot"
          git config user.email "actions@github.com"
          git add -A estado relatorios || true
          git diff --cached --quiet || git commit -m "retomada: $(date -u +%FT%H)"
          git push
