name: Onisciente — agenda da série histórica (desde 2019)
# Todo dia 10 às 16h UTC (13h em Goiânia): acrescenta 12 meses antes do começo atual do banco,
# até janeiro do primeiro exercício do alvo (2019). Completa a série, a rodada não faz nada.
# A coleta é incremental: soma ao banco dados/onisciente/historico.db e nunca refaz a série inteira
# (onisciente/agenda.py). Falha de motor deixa o fluxo vermelho e fica registrada em
# relatorios/onisciente/agenda_estado.json e na página docs/onisciente/agenda.html.
on:
  schedule: [{cron: "0 16 10 * *"}]
  workflow_dispatch:
permissions: {contents: write, actions: write}
# Todos os fluxos que gravam o banco dividem o mesmo grupo: um espera o outro terminar.
concurrency: {group: onisciente-banco, cancel-in-progress: false}
jobs:
  agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # O banco é estado: um pedido que esperou na fila deve partir da ponta do branch,
      # não do commit da hora do pedido (senão a gravação final conflita com a rodada anterior).
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet PyYAML openpyxl pypdf requests
      - name: Rodada serie
        run: python -m onisciente.agenda serie --brutos "$RUNNER_TEMP/brutos"
      - name: Diagnóstico e página do banco
        if: ${{ !cancelled() }}
        run: python -m onisciente diagnostico
      - name: Resultado na página da execução
        if: ${{ !cancelled() }}
        run: |
          python -m onisciente.agenda pagina
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          e = json.load(open("relatorios/onisciente/agenda_estado.json", encoding="utf-8"))
          r = e["rodadas"].get("serie", {})
          print("## Agenda: rodada serie\n")
          print("Resultado:", "funcionou" if r.get("ok") else "FALHOU (falha do sistema)")
          if r.get("erro"):
              print("\nErro:", r["erro"])
          print("\n```json\n" + json.dumps(r.get("resumo", {}), ensure_ascii=False, indent=1) + "\n```")
          PY
      - name: Guardar as respostas cruas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: onisciente-agenda-serie-brutos
          path: ${{ runner.temp }}/brutos
          retention-days: 14
          if-no-files-found: ignore
      - name: Publicar banco, relatórios e páginas
        if: ${{ !cancelled() }}
        run: |
          git config user.name "vigilancia-bot"; git config user.email "bot@users.noreply.github.com"
          git add dados/onisciente/historico.db relatorios/onisciente docs/onisciente estado/onisciente_coleta.json
          git diff --staged --quiet && exit 0
          git commit -m "Onisciente: agenda serie $(date -u +%F)"
          for n in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((n * 10))
          done
          exit 1
      - name: Atualizar o painel publicado
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh workflow run publicar-painel.yml --ref main
