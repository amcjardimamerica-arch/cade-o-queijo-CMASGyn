name: Fiscalizacao - semanal administrativa e mensal financeira
on:
  schedule:
    - cron: '0 9 * * 1'
    - cron: '0 10 1 * *'
  workflow_dispatch:
permissions: {contents: write, issues: write}
jobs:
  fiscalizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install --quiet pdfplumber pypdf pyyaml requests beautifulsoup4
      - name: Rodar fiscalizacao
        run: python src/run_fiscalizacao.py | tee /tmp/saida.txt
      - name: Publicar
        run: |
          git config user.name "vigilancia-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A dados docs relatorios || true
          git diff --staged --quiet || git commit -m "fiscalizacao $(date +%F)"
          git push
      - name: Abrir parecer quando houver irregularidade
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const d=JSON.parse(fs.readFileSync('relatorios/achados_consolidados_2026.json','utf8'));
            if(!d.parecer_devido||!d.total) return;
            const s=d.por_severidade||{}, sel=d.por_selo||{};
            const lin=d.achados.slice(0,12).map(a=>`- **[${a.codigo}]** ${a.titulo} — ${a.severidade}, ${a.selo}`);
            await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,
              title:`Parecer devido — ${d.total} irregularidades (${s.critica||0} criticas)`,
              body:[`Fiscalizacao de ${d.gerado_em}.`,'',
                `**${d.total} achados** — ${s.critica||0} criticos, ${s.alta||0} altos, ${s.media||0} medios.`,
                `Selos: ${sel.CONFIRMADO||0} confirmados, ${sel.INDICIARIO||0} indiciarios, `+
                `${sel.INCONCLUSIVO_POR_DOCUMENTO_FALTANTE||0} inconclusivos por documento faltante.`,'',
                '### Achados principais','',...lin,'',
                `### Documentos a requisitar`,'',
                `${d.documentos_requisitados} documentos complementares, listados em `+
                `\`relatorios/achados_consolidados_2026.json\` e em \`config/documentos_complementares.json\`.`,'',
                'Parecer completo: `relatorios/Parecer_Juridico_Financeiro_2026.docx`.',
                'Trilha do dinheiro: `docs/trilha_2026.html`.','',
                'Nada aqui e peca processual sem revisao do advogado, artigo 32 da Lei 8.906/1994.'
              ].join('\n')});
