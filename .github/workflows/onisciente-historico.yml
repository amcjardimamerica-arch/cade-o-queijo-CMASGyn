name: Onisciente — coleta histórica
# Liga os motores de busca para um intervalo de meses, guarda tudo no banco
# dados/onisciente/historico.db e escreve o diagnóstico de onde o sistema falha
# e onde pode melhorar (relatorios/onisciente/diagnostico_historico.md).
# Roda no GitHub porque daqui a rede é aberta; as respostas cruas ficam como
# artefato da execução por 30 dias.
# Só roda quando pedida: um envio de código nunca refaz o banco do zero.
on:
  workflow_dispatch:
    inputs:
      desde: {description: "Primeiro mês (AAAA-MM)", default: "2024-11"}
      ate: {description: "Último mês (AAAA-MM)", default: "2026-11"}
      motores: {description: "Motores, separados por vírgula (vazio = todos)", default: ""}
permissions: {contents: write}
# O mesmo grupo dos fluxos da agenda (onisciente-agenda-*.yml): nunca dois gravando o banco.
concurrency: {group: onisciente-banco, cancel-in-progress: false}
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DESDE: ${{ inputs.desde || '2024-11' }}
      ATE: ${{ inputs.ate || '2026-11' }}
      MOTORES: ${{ inputs.motores || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet PyYAML openpyxl pypdf
      - name: Conferir as duas vias do Querido Diário
        # O subdomínio antigo recusou o TLS do robô nas duas rodadas de novembro; o motor agora
        # tenta primeiro a API no próprio domínio (queridodiario.ok.org.br/api). Isto só grava no
        # log da execução o que cada via responde; quem decide a via é o motor (meta qd_via).
        if: ${{ env.MOTORES == '' || contains(env.MOTORES, 'querido_diario') }}
        run: |
          for U in "https://queridodiario.ok.org.br/api/gazettes" "https://api.queridodiario.ok.org.br/gazettes"; do
            echo "== $U"
            curl -sS --max-time 30 -o /dev/null -w '%{http_code} %{ssl_verify_result}\n' "$U?territory_ids=5208707&size=1" 2>&1 | head -5 || echo "sem resposta"
          done
      - name: Ligar os motores
        # Enquanto os motores correm, um boletim (o que cada fonte respondeu, erros e tempos)
        # é publicado no ramo a cada 10 minutos em relatorios/onisciente/boletim_coleta.md,
        # numa cópia à parte do ramo, para os erros aparecerem durante a rodada e não só no fim.
        run: |
          INICIO=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)
          python -m onisciente historico --desde "$DESDE" --ate "$ATE" \
            ${MOTORES:+--motores "$MOTORES" --somar} --brutos "$RUNNER_TEMP/brutos" &
          MOTOR=$!
          git config --global user.name "vigilancia-bot"; git config --global user.email "bot@users.noreply.github.com"
          git worktree add -q "$RUNNER_TEMP/boletim" HEAD
          publicar() {
            [ -f dados/onisciente/historico.db ] || return 0
            python -m onisciente.boletim dados/onisciente/historico.db "$INICIO" > "$RUNNER_TEMP/boletim.md" || return 0
            ( cd "$RUNNER_TEMP/boletim" && git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard FETCH_HEAD \
              && mkdir -p relatorios/onisciente && cp "$RUNNER_TEMP/boletim.md" relatorios/onisciente/boletim_coleta.md \
              && git add relatorios/onisciente/boletim_coleta.md \
              && { git diff --staged --quiet || { git commit -q -m "Onisciente: boletim da coleta em andamento [skip ci]" \
                   && git push -q origin "HEAD:$GITHUB_REF_NAME"; }; } ) || echo "boletim não publicado agora"
          }
          while kill -0 $MOTOR 2>/dev/null; do
            for _ in $(seq 60); do kill -0 $MOTOR 2>/dev/null || break; sleep 10; done
            publicar
          done
          wait $MOTOR
          publicar
      - name: Diagnóstico na página da execução
        if: always()
        run: |
          if [ -f relatorios/onisciente/diagnostico_historico.md ]; then
            cat relatorios/onisciente/diagnostico_historico.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar as respostas cruas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onisciente-historico-brutos
          path: ${{ runner.temp }}/brutos
          retention-days: 30
          if-no-files-found: ignore
      - name: Publicar banco, diagnóstico e a página do banco
        run: |
          ls -l dados/onisciente/historico.db
          git config user.name "vigilancia-bot"; git config user.email "bot@users.noreply.github.com"
          git worktree remove --force "$RUNNER_TEMP/boletim" 2>/dev/null || true
          git add dados/onisciente/historico.db relatorios/onisciente/diagnostico_historico.* docs/onisciente/banco docs/onisciente/index.html
          git diff --staged --quiet && exit 0
          git commit -m "Onisciente: coleta histórica $DESDE a $ATE"
          for n in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((n * 10))
          done
          exit 1
