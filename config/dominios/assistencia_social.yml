# DOMÍNIO: ASSISTÊNCIA SOCIAL — CMASGyn
#
# Este arquivo é o molde. Para fiscalizar outra política — cultura, saúde,
# educação, meio ambiente — copie-o, troque a função orçamentária, o conselho,
# o fundo e o corpo normativo. O motor não muda.

id: assistencia_social
nome: "Assistência Social — CMASGyn"
ativo: true

conselho:
  sigla: "CMASGyn"
  nome: "Conselho Municipal de Assistência Social de Goiânia"
  lei_de_criacao: "Lei 7.532/1995"
  sitio: "https://cmasgyn.com.br"
  regimento_interno: "https://cmasgyn.com.br/Resources/documentos/legislacao/regimento_interno.pdf"

orgao_gestor:
  sigla: "SEMAS"
  nome: "Secretaria Municipal de Assistência Social"

fundo:
  sigla: "FMAS"
  nome: "Fundo Municipal de Assistência Social"

# Classificação funcional-programática. É a chave da generalização:
# a função orçamentária identifica a política sem ambiguidade.
orcamento:
  funcao: "08"                 # 08 = Assistência Social
  subfuncoes:
    "241": "Assistência ao Idoso"
    "242": "Assistência à Pessoa com Deficiência"
    "243": "Assistência à Criança e ao Adolescente"
    "244": "Assistência Comunitária"

# Naturezas de despesa que interessam ao rastreamento do dinheiro.
naturezas_relevantes:
  "33504300": "Subvenções sociais a instituição privada sem fins lucrativos"
  "33504100": "Contribuições a instituição privada sem fins lucrativos"
  "33503900": "Outros serviços de terceiros — instituição privada"
  "33903900": "Outros serviços de terceiros — pessoa jurídica"
  "33903200": "Material de distribuição gratuita"
  "33903000": "Material de consumo"
  "44905200": "Equipamentos e material permanente"
  "33901400": "Diárias"

# Transferências que devem ser conciliadas, por ente de origem.
transferencias:
  uniao:
    - {sigla: "IGD-PBF", nome: "Índice de Gestão Descentralizada do Bolsa Família"}
    - {sigla: "IGD-SUAS", nome: "Índice de Gestão Descentralizada do SUAS"}
    - {sigla: "PSB", nome: "Piso Básico Fixo e Variável — Proteção Social Básica"}
    - {sigla: "PSE", nome: "Piso Fixo e Variável — Proteção Social Especial"}
    - {sigla: "PAIF", nome: "Serviço de Proteção e Atendimento Integral à Família"}
    - {sigla: "SCFV", nome: "Serviço de Convivência e Fortalecimento de Vínculos"}
    - {sigla: "EMENDA", nome: "Emenda parlamentar federal"}
  estado:
    - {sigla: "FEAS", nome: "Fundo Estadual de Assistência Social"}
    - {sigla: "COFIN-GO", nome: "Cofinanciamento estadual"}
  municipio:
    - {sigla: "TESOURO", nome: "Recursos ordinários do tesouro municipal"}
    - {sigla: "FMAS-PROPRIO", nome: "Recursos próprios do Fundo"}

# Termos de gatilho específicos deste domínio.
termos:
  ancora:
    - "CMAS ?Gyn"
    - "Conselho Municipal de Assist[êe]ncia Social"
    - "Fundo Municipal de Assist[êe]ncia Social"
    - "(?-i:\\bCMAS\\b)"
    - "(?-i:\\bFMAS\\b)"
  programas:
    - "(?-i:\\bIGD[- ]?(?:M|PBF|SUAS)\\b)"
    - "Bolsa Fam[íi]lia"
    - "Cadastro [ÚU]nico|Cad[ÚU]nico"
    - "Piso (?:B[áa]sico|Fixo|Vari[áa]vel|de Alta Complexidade)"
    - "Servi[çc]o de Conviv[êe]ncia"
    - "Prote[çc][ãa]o Social (?:B[áa]sica|Especial)"
    - "(?-i:\\bCRAS\\b|\\bCREAS\\b)"
    - "Acolhimento Institucional"
    - "Benef[íi]cio[s]? Eventua(?:l|is)"

# Normas que compõem o corpus deste domínio (o corpus geral fica em corpus.yml).
normas_setoriais:
  - "Lei 8.742/1993"
  - "Resolução CNAS 109/2009"
  - "Resolução CNAS 33/2012"
  - "Resolução CNAS 14/2014"
  - "Resolução CNAS/MDS 202/2025"
  - "Portaria MDS 1.041/2024"
