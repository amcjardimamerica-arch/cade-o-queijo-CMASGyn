# CORPUS NORMATIVO FIXO
# Baixado e consolidado a cada 30 dias por src/corpus_build.py.
# A rotina DIÁRIA jamais pesquisa norma nova: lê exclusivamente corpus/corpus.md.
# Isso mantém o prefixo do prompt byte-idêntico e permite cache de 1 hora
# a 10% do custo de entrada.

