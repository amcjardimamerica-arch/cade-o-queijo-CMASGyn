# Os 183 requisitos do projeto original do Onisciente e onde cada um está.
# Fonte: conferência de 26/11/2026 (documento "Onisciente: conferência do projeto original").
# situacao: cumprido (vale 1), parcial (0,5), ausente (0). Todo cumprido tem evidência;
# quando há trava, é o teste que falha se o requisito deixar de ser cumprido.
# Recontagem: python -m onisciente requisitos
- id: 1
  bloco: Premissas
  requisito: 'Trilha e não cartório: cada número leva fonte e selo'
  situacao: parcial
  evidencia: Selos e custódia existem; os tetos do Município saem do RGF com duas vias seladas (RGF × RREO) desde o bloco
    1; desde o bloco 3 cada afluente do rio do Município leva o selo da conferência RREO × matriz de saldos contábeis e a
    origem (União × Município) leva o seu
  falta: Selar as contas uma a uma da despesa e guardar o original de cada número
- id: 2
  bloco: Premissas
  requisito: Funciona sozinho, no relógio
