- id: 146
  bloco: Fontes e cadência
  requisito: FNS
  situacao: cumprido
  evidencia: 'Coletor onisciente/coletores/fns.py, com motor_fns, motor_fns_entidades, motor_fns_detalhe e motor_fns_repasse_dia.
    As entidades reais de Goiânia fecham em duas páginas de 100 (191 em 2025, 197 em 2024, todas com o IBGE 520870), entre
    elas o Fundo Municipal de Saúde (37.623.352/0001-03); pessoa física fica com o cpfCnpj que o FNS publica (decisão do usuário
    de 28/11/2026, 11:18Z, P-01); as 82 entidades gravadas antes com o CPF mascarado pelo coletor são lidas de novo pelo motor
    fns. Com as respostas reais do Fundo em 2025: detalhe-acao traz as 40 ações, e a soma delas é o total geral que a própria
    resposta declara (R$ 1.030.381.073,26 brutos, R$ 69.478.347,99 de desconto); detalhe-pagamento com acoes vazio traz todas
    as ordens do ano (676, em 7 páginas), cada uma com a ação (id.programaFundo.id), o mês do pagamento, o documento do SIAFI
    (2025OB000028) e a parcela. motor_fns_detalhe lê as ações e todas as ordens de uma vez, confere a soma das ordens de cada
    ação com o total dela, grava as ações em fns_acoes e só as ordens fundo a fundo em repasses_fns (os pagamentos com indicadorFundoAFundo
    N, documento PF e conta UNICA, ficam de fora e anotados), não grava nada se a listagem vier pela metade e não duplica
    quando outra via já preencheu o ano. Se a listagem não vier, lê ação por ação, como a tela. O repasse do dia nacional
    é lido dia a dia e fecha as somas. Na coleta d532c1d, real: 197, 191 e 181 entidades em 2024, 2025 e 2026; 42, 40 e 43
    ações (125 em fns_acoes); 527, 481 e 474 ordens fundo a fundo do Fundo (1.482 em repasses_fns); 777 dias do repasse nacional.
    A paginação da listagem repete ordens entre páginas e perde outras: a linha que reaparece em outra página não conta de
    novo, a listagem curta é relida (RELEITURAS_FNS) e, se ainda faltar ordem, o motor lê por ação e anota por quê. Na sondagem
    a8761d9, as páginas 1, 2 e 7 da listagem de 2025 vieram byte a byte iguais às da coleta (sha256 b773ee82, dee7cb79, f0bc6bcb,
    35 minutos depois): a repetição de ordens entre páginas é fixa, por isso fica uma releitura só (RELEITURAS_FNS = 1) antes
    de ir por ação. O filtro por ação respondeu de verdade: acoes=61659 trouxe só ordens da ação 61659, 166 no total, em 2
    páginas (a 1: 100 ordens, 27 fundo a fundo, R$ 427.949.655,59). Na sondagem 9cc559c, count=1000 trouxe a listagem de 2025
    numa página só, de 691.235 bytes: o recorte guardado (os primeiros 600 KB, 587 ordens inteiras) não repete nenhuma ordem,
    começa pelas 100 da página 1 na mesma ordem e contém todas as da página 2; o motor agora pede as ordens com count=1000
    (fns.POR_PAGINA_PAGAMENTOS), uma leitura por ano, e a releitura fica de reserva. A página 2 de acoes=61659 mostrou que,
    com 100 por página, o filtro por ação também repete (6 ordens) e perde outras 6; as 160 únicas mais as 6 que só a página
    de 1000 trouxe dão as 166 ordens da ação, que somam R$ 669.552.284,15. A diferença de R$ 5.838.778,09 é uma ordem só,
    a 2025OB016558 (fundo a fundo, portaria 6464), com motivoRejeicao de cancelamento parcial por comando do gestor: sem ela,
    as ordens dão exatamente os R$ 663.713.506,06 que detalhe-acao declara para a ação. O leitor guarda o motivoRejeicao,
    e o motor tira a ordem rejeitada do pago e de repasses_fns, com nota, nos dois caminhos (listagem e por ação). Na sondagem
    079a72d a página de 1000 foi guardada inteira (691.235 bytes, d1_fns entre as fontes grandes): total 676, totalPaginas
    1, as 676 ordens sem nenhuma repetida, começando pelas 100 da página 1 de 100. Somam R$ 1.036.219.851,35, o valorTotalGeral
    do servidor; sem a 2025OB016558, dão R$ 1.030.381.073,26, o total das 40 ações de detalhe-acao, e cada uma das 40 ações
    fecha com as suas ordens. Com essas duas respostas reais, motor_fns_detalhe faz uma leitura só da listagem, grava as 40
    ações com o pago igual ao total e as ordens fundo a fundo em repasses_fns, sem nenhuma divergência (trava test_motor_fns_com_as_respostas_reais_de_2025_fecha_todas_as_acoes_numa_leitura).
    Se outro ano não fechar, o motor diz qual ação e quanto. Na coleta real 6c474b1 (2024-11 a 2026-11), os 3 anos vieram
    pela página de 1000 e fecharam sem a nota de divergência: 526, 480 e 472 ordens fundo a fundo em repasses_fns (2025 com
    a nota da 2025OB016558). As 8 vias antigas de motor_fns falharam nos 3 anos, como já na coleta d532c1d (4 em apifns.saude.gov.br
    sem DNS, 7 minutos em 12 chamadas; 3 com HTTP 400; 1 com 404) e deixavam uma linha de falha por ano. Agora a chamada do
    FNS lê as entidades e a consulta detalhada primeiro, e motor_fns só tenta o ano que ela não preencheu, sem linha de falha
    para o ano lido (trava test_chamada_do_fns_le_a_consulta_detalhada_antes_e_nao_tenta_as_vias_antigas_no_ano_lido).'
  falta: ''
  trava: testes/test_coletores_federais_decima_segunda.py::test_motor_fns_com_as_respostas_reais_de_2025_fecha_todas_as_acoes_numa_leitura
