- {id: 141, situacao: parcial, evidencia: "O motor execucao_goiania lê a página real Portal_Despesas.aspx pela exportação CSV do mês, o caminho que a sondagem d2_transweb de 28/11/2026 (run 46087866124) comprovou: GET da página, postback comum com mês e ano, selExportar = CSV e o botão OK; a resposta foi a planilha de outubro de 2026 (uma linha por liquidação e ordem de pagamento, só os empenhos do mês, liquidações e pagamentos até a data da leitura). Cada empenho vira eventos empenho, anulação, liquidação e pagamento em despesa_eventos, com CNPJ (o CPF que a coluna traz com 000 na frente vira CPF), favorecido, objeto, modalidade, número da licitação, natureza, função, subfunção e fonte; linhas repetidas e liquidações anuladas não contam duas vezes; a releitura troca os eventos do empenho sem duplicar; cada rodada lê os meses que faltam e relê os 12 mais recentes. Os popups de liquidação e de pagamento conferem, por amostra, os três empenhos de maior valor pago de cada mês, e a divergência fica anotada na consulta. O EmpenhoPopUp pedido com & trouxe os campos (confirmado). O Buscar foi recusado (OsAjax: HTTP 500; postback: página Erro Interno) e fica só como reserva quando a exportação falhar. Sexta rodada: a coleta real do GitHub (rodada 46093388087) gravou zero eventos porque o leitor comum não guarda cookies e o postback da exportação chegava sem a sessão do GET (19.654 bytes, sem a planilha); o motor agora lê o TransWeb numa sessão de cookies, grava o mês em coletas e, quando a resposta não é a planilha, o motivo legível (título e texto da página) no erro da coleta. Testado com o recorte real da planilha (dez empenhos de credores pessoas jurídicas, byte a byte) e o EmpenhoPopUp real. A lista de arquivos da categoria 49 do WordPress continua montada no navegador (fonte secundária, não usada). Sétima rodada: a coleta com cookies gravou 86.401 eventos, só de 2025-10 a 2026-11, porque o limite era de 14 meses por rodada (338 s de 60 min) e a soma apagava despesa_eventos e despesa_consultas antes de o motor rodar; agora o limite é 40, os meses que faltam (ou incompletos) vêm antes das releituras, o motor para dois minutos antes do fim do tempo e a soma só apaga as coletas do motor. O CPF de pessoa física é gravado mascarado (***.NNN.NNN-**), no coletor, nas respostas guardadas da sondagem e nas linhas antigas (migração no Banco.abrir, numa rodada própria do rastreio); o vínculo com o contrato do PNCP casa a pessoa física pelos seis do meio e o nome. Oitava rodada: a coleta 550c30b trouxe os 25 meses (155.879 eventos); o CPF que sobrava no credor e no histórico também sai mascarado (coletor e migração); as divergências da amostra eram a paginação do popup (50 linhas por página: cada soma do popup é a das primeiras linhas da exportação), e a primeira página passa a ser conferida linha a linha pelo número. Nona rodada: no banco real (coleta d532c1d), despesa_consultas tem os 25 meses de 2024-11 a 2026-11 com a última leitura lida (990 a 12.097 linhas da planilha por mês) e despesa_eventos tem 155.879 eventos de 04/11/2024 a 26/11/2026; a amostra lê o popup inteiro, página a página, pelo next do navegador da lista (OsAjax com o __OSVSTATE), e confere a soma das páginas com a exportação (testado com popup sintético na navegação real da lista). Décima rodada: a sondagem de 28/11/2026 06:50Z (a8761d9) leu a página 1 real dos popups de 4 empenhos (HTTP 200, 41 a 55 KB, totais de 54 a 1.718 linhas), e o pedido da página 2 voltou HTTP 500 com 894 bytes nos 8 casos; o mesmo 500 veio em todos os OsAjax já mandados, inclusive os da lista. O _osjs.js guardado mostra que o __AJAX leva o contexto do evento (largura, altura, id de origem, posições), e não os baldes que o coletor mandava; o pedido da página seguinte do popup agora leva o contexto, a caixa marcada como on e os cabeçalhos do OsAjax (X-Requested-With, Accept, Referer, Origin), e a sondagem guarda o pedido inteiro (cabeçalhos, nomes dos cookies sem valor) e o corpo do 500 (trava com o recorte real: test_pedido_da_pagina_2_do_popup_real_leva_o_contexto_do_evento_e_os_cabecalhos_do_osajax).", falta: "Rodar de novo a sondagem d2_transweb_popup com o pedido novo e ver a página 2 abrir de verdade (HTTP 200 com as linhas 51 em diante) e a soma das páginas bater com a exportação; se voltar 500, o corpo da recusa e o pedido inteiro ficam guardados para a próxima prova (o ?_ts= no endereço é a diferença que sobra com o navegador). Depois, a coleta diária: a agenda já tem o grupo execucao_goiania, mas o cron só roda quando a versão nova entrar na main, o que depende do sim do usuário.", trava: "testes/test_execucao.py::test_popup_paginado_e_lido_inteiro_pelo_next_e_a_soma_confere"}
