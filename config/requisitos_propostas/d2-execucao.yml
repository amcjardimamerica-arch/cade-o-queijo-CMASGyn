- {id: 141, situacao: parcial, evidencia: "O motor execucao_goiania lê a página real Portal_Despesas.aspx pela exportação CSV do mês, o caminho que a sondagem d2_transweb de 28/11/2026 (run 46087866124) comprovou: GET da página, postback comum com mês e ano, selExportar = CSV e o botão OK; a resposta foi a planilha de outubro de 2026 (uma linha por liquidação e ordem de pagamento, só os empenhos do mês, liquidações e pagamentos até a data da leitura). Cada empenho vira eventos empenho, anulação, liquidação e pagamento em despesa_eventos, com CNPJ (o CPF que a coluna traz com 000 na frente vira CPF), favorecido, objeto, modalidade, número da licitação, natureza, função, subfunção e fonte; linhas repetidas e liquidações anuladas não contam duas vezes; a releitura troca os eventos do empenho sem duplicar; cada rodada lê os meses que faltam e relê os 12 mais recentes. Os popups de liquidação e de pagamento conferem, por amostra, os três empenhos de maior valor pago de cada mês, e a divergência fica anotada na consulta. O EmpenhoPopUp pedido com & trouxe os campos (confirmado). O Buscar foi recusado (OsAjax: HTTP 500; postback: página Erro Interno) e fica só como reserva quando a exportação falhar. Sexta rodada: a coleta real do GitHub (rodada 46093388087) gravou zero eventos porque o leitor comum não guarda cookies e o postback da exportação chegava sem a sessão do GET (19.654 bytes, sem a planilha); o motor agora lê o TransWeb numa sessão de cookies, grava o mês em coletas e, quando a resposta não é a planilha, o motivo legível (título e texto da página) no erro da coleta. Testado com o recorte real da planilha (dez empenhos de credores pessoas jurídicas, byte a byte) e o EmpenhoPopUp real. A lista de arquivos da categoria 49 do WordPress continua montada no navegador (fonte secundária, não usada). Sétima rodada: a coleta com cookies gravou 86.401 eventos, só de 2025-10 a 2026-11, porque o limite era de 14 meses por rodada (338 s de 60 min) e a soma apagava despesa_eventos e despesa_consultas antes de o motor rodar; agora o limite é 40, os meses que faltam (ou incompletos) vêm antes das releituras, o motor para dois minutos antes do fim do tempo e a soma só apaga as coletas do motor. O CPF de pessoa física é gravado mascarado (***.NNN.NNN-**), no coletor, nas respostas guardadas da sondagem e nas linhas antigas (migração no Banco.abrir, numa rodada própria do rastreio); o vínculo com o contrato do PNCP casa a pessoa física pelos seis do meio e o nome. Oitava rodada: a coleta 550c30b trouxe os 25 meses (155.879 eventos); o CPF que sobrava no credor e no histórico também sai mascarado (coletor e migração); as divergências da amostra eram a paginação do popup (50 linhas por página: cada soma do popup é a das primeiras linhas da exportação), e a primeira página passa a ser conferida linha a linha pelo número. Nona rodada: no banco real (coleta d532c1d), despesa_consultas tem os 25 meses de 2024-11 a 2026-11 com a última leitura lida (990 a 12.097 linhas da planilha por mês) e despesa_eventos tem 155.879 eventos de 04/11/2024 a 26/11/2026; a amostra lê o popup inteiro, página a página, pelo next do navegador da lista (OsAjax com o __OSVSTATE), e confere a soma das páginas com a exportação (testado com popup sintético na navegação real da lista). Décima rodada: a sondagem de 28/11/2026 06:50Z (a8761d9) leu a página 1 real dos popups de 4 empenhos (HTTP 200, 41 a 55 KB, totais de 54 a 1.718 linhas), e o pedido da página 2 voltou HTTP 500 com 894 bytes nos 8 casos; o mesmo 500 veio em todos os OsAjax já mandados, inclusive os da lista. O _osjs.js guardado mostra que o __AJAX leva o contexto do evento (largura, altura, id de origem, posições), e não os baldes que o coletor mandava; o pedido da página seguinte do popup agora leva o contexto, a caixa marcada como on e os cabeçalhos do OsAjax (X-Requested-With, Accept, Referer, Origin), e a sondagem guarda o pedido inteiro (cabeçalhos, nomes dos cookies sem valor) e o corpo do 500 (trava com o recorte real: test_pedido_da_pagina_2_do_popup_real_leva_o_contexto_do_evento_e_os_cabecalhos_do_osajax). Décima primeira rodada: a sondagem de 28/11/2026 07:30Z, com esse pedido, abriu a página 2 dos popups de liquidação e de pagamento nos 4 empenhos (HTTP 200, 18 a 54 KB) e as páginas 2 e 3 do empenho de 1.695 e 1.718 linhas. Em 6 dos 8 popups (3 empenhos) a leitura fechou inteira, e as liquidações e os pagamentos lidos são os da exportação no banco real, número a número (59, 52 e 76 de cada tipo; 568.320.000,00, 391.926.248,97 e 359.864.344,52); as outras linhas do popup são anulações e ordens, que a exportação traz à parte. No empenho 20261201000430004 a sondagem parou no teto de 3 páginas (150 de 1.693 liquidações e pagamentos, todos iguais aos da exportação); o motor lê até 60 páginas e a sondagem agora até 40. A lista de Portal_Despesas.aspx por OsAjax passou a mandar o mesmo contexto e os mesmos cabeçalhos (trava com o recorte real das páginas 1 e 2: test_popup_real_soma_das_duas_paginas_bate_com_a_exportacao_linha_a_linha). Décima segunda rodada: a sondagem de 28/11/2026 07:57Z recebeu HTTP 200 no Buscar e na página 2 da lista por OsAjax (858 KB e 851 KB; antes, HTTP 500) e no buscar_antes do motor; a lista de outubro de 2026 tem 792 empenhos, 20 por página, e a página 2 (21 a 40) não repete nenhum da 1 (trava: test_lista_osajax_real_buscar_e_pagina_2_leem_20_linhas_cada_sem_repetir). Os 8 popups foram lidos inteiros, sem erro; o do empenho 20261201000430004 (34 e 35 páginas, 1.695 e 1.718 linhas) tem 1.693 liquidações e 1.693 pagamentos, iguais aos da exportação em número e em soma (16.441.027,87); as 2 linhas a mais do popup de liquidação são linhas sem saldo liquidado e as 25 a mais do de pagamento são linhas sem valor pago, que o coletor não conta como liquidação ou pagamento e a exportação também não traz como tal (os corpos das páginas 4 em diante não foram guardados, então o tipo de cada uma, anulação ou ordem, ainda não foi visto) (trava: test_popup_real_de_1695_linhas_fecha_com_a_exportacao).", falta: "A leitura da fonte está provada: a exportação do mês, a lista por OsAjax e os popups página a página, conferidos com a exportação. O requisito é Portal da Transparência (diário), no bloco Fontes e cadência: fica parcial até a coleta rodar todo dia pela agenda, que já tem o grupo execucao_goiania, mas o cron só roda quando a versão nova entrar na main, o que depende do sim do usuário. A próxima sondagem registra, no resumo de cada popup, as linhas que não são do tipo (outras_linhas), para mostrar uma a uma as 2 anulações e as 25 ordens do empenho 20261201000430004.", trava: "testes/test_execucao.py::test_popup_real_soma_das_duas_paginas_bate_com_a_exportacao_linha_a_linha"}
