- id: 154
  situacao: parcial
  evidencia: "TCU com as duas vias reais (pesquisa documentosResumidos e dados abertos). A pesquisa vai de 50 em 50: a página com inicio=50 veio inteira (50 acórdãos, 42 sobre Goiânia) e a de inicio=100 com 100 por vez caiu duas vezes; uma página que cai guarda as anteriores e anota o erro. TCM-GO: os dados abertos de contas irregulares (ws.tcm.go.gov.br, CSV real com 1.395 linhas, 94 de Goiânia) são lidos por tcm.contas: o órgão sai do nome do Município (GOIANIA - COMURG), Aparecida de Goiânia e Goianira não entram, e a tabela contas_irregulares_tcm ganhou CPF parcial, assunto, decisão, data do julgamento, tipo de lista e endereço do processo (banco antigo recebe as colunas sem perder linhas). A conferência transforma cada linha em alerta (com débito, alerta alto) e procura o mesmo nome entre os sócios das contratadas, como indício de possível homônimo, porque o TCM mostra só os dois primeiros dígitos do CPF e a Receita só os do meio."
  falta: "A pesquisa de jurisprudência do TCM-GO (virtual.tcmgo) ainda não devolve decisões; o acesso à informação e o painel das câmaras deram 403. A jurisprudência é um aplicativo React: a próxima sondagem (d1_tcm) baixa o pacote JavaScript para achar a API de pesquisa."
  trava: "testes/test_coletores_federais_quarta.py::test_contas_irregulares_viram_alerta_e_o_socio_homonimo_e_indicio"
