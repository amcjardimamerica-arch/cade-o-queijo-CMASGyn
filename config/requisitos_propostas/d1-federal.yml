480 e 472 ordens fundo a fundo em repasses_fns (2025 com a nota da 2025OB016558). As 8 vias antigas de motor_fns falharam nos 3 anos, como já na coleta d532c1d (4 em apifns.saude.gov.br sem DNS, 7 minutos em 12 chamadas; 3 com HTTP 400; 1 com 404) e deixavam uma linha de falha por ano. Agora a chamada do FNS lê as entidades e a consulta detalhada primeiro, e motor_fns só tenta o ano que ela não preencheu, sem linha de falha para o ano lido (trava test_chamada_do_fns_le_a_consulta_detalhada_antes_e_nao_tenta_as_vias_antigas_no_ano_lido)."
