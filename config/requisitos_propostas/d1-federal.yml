- id: 154
  situacao: parcial
  evidencia: "TCU com as duas vias reais (pesquisa documentosResumidos e dados abertos). A ordem padrão da pesquisa (DTRELEVANCIA desc) já vem da sessão mais nova para a mais antiga: as páginas reais com inicio=50 e inicio=100 vão de 28/10/2025 a 26/10/2022 sem quebrar a ordem; a ordem por ano e número encerrou a conexão. Uma página que cai guarda as anteriores e anota o erro. TCM-GO: os dados abertos de contas irregulares (ws.tcm.go.gov.br, CSV real com 1.395 linhas, 94 de Goiânia) são lidos por tcm.contas, com CPF parcial, assunto, decisão, data do julgamento, tipo de lista e endereço do processo; a conferência transforma cada linha em alerta e procura o mesmo nome entre os sócios das contratadas, como indício de possível homônimo. A jurisprudência do TCM-GO tem API (o pacote real da tela de pesquisa): motor_tcm lê buscar (texto, page, page_size, sort_by=data_sessao, com o cabeçalho X-Cliente: portal) e guarda as decisões sobre Goiânia (Aparecida de Goiânia fica de fora); se a API não responder, tenta os candidatos antigos e diz por quê. O /v1/health real respondeu healthy."
  falta: "A resposta real de buscar e de filtros da jurisprudência do TCM-GO (a sondagem d1_tcm pede as duas, com o cabeçalho); o teste usa uma resposta montada com os campos da tela. No TCU, inicio=100 respondeu nesta rodada e encerrou a conexão na anterior: o motor ainda para em 100 resultados porque a trava da sexta rodada (test_tcu_pesquisa_nao_pede_alem_de_100_e_diz_por_que) exige isso; tirar o corte depende de decisão do coordenador sobre essa trava. A sondagem pede inicio=150 e inicio=1300. O acesso à informação e o painel das câmaras deram 403."
  trava: "testes/test_coletores_federais_setima.py::test_motor_tcm_le_a_api_com_o_cabecalho_e_so_cai_nos_candidatos_se_ela_falhar"
