- id: 154
  situacao: parcial
  evidencia: "TCU com as duas vias reais (pesquisa documentosResumidos e dados abertos). A ordem padrão da pesquisa (DTRELEVANCIA desc) já vem da sessão mais nova para a mais antiga: as páginas reais com inicio=50 e inicio=100 vão de 28/10/2025 a 26/10/2022 sem quebrar a ordem; a ordem por ano e número encerrou a conexão. Uma página que cai guarda as anteriores e anota o erro. TCM-GO: os dados abertos de contas irregulares (ws.tcm.go.gov.br, CSV real com 1.395 linhas, 94 de Goiânia) são lidos por tcm.contas, com CPF parcial, assunto, decisão, data do julgamento, tipo de lista e endereço do processo; a conferência transforma cada linha em alerta e procura o mesmo nome entre os sócios das contratadas, como indício de possível homônimo. A jurisprudência do TCM-GO tem API (o pacote real da tela de pesquisa): motor_tcm lê buscar (texto, page, page_size, sort_by=data_sessao, com o cabeçalho X-Cliente: portal) e guarda as decisões sobre Goiânia (Aparecida de Goiânia fica de fora); se a API não responder, tenta os candidatos antigos e diz por quê. O /v1/health real respondeu healthy. Na coleta d532c1d a API respondeu de verdade: 5 páginas de 100 (uns 2 s cada), 190 decisões sobre Goiânia guardadas, com número, data da sessão, relator, colegiado e processo, de 03/09 a 27/10/2026. Como 500 decisões só cobrem uns dois meses, o motor agora segue da sessão mais nova até passar do começo do intervalo (teto tcm.PAGINAS_JURISPRUDENCIA = 80) e, se o teto parar antes, diz até onde chegou."
  falta: "A resposta de filtros da jurisprudência do TCM-GO (para filtrar por município) e o TCU além de 100: a sondagem 1e36935 saiu vazia porque o fluxo passou as fontes num argumento só, separadas por vírgula (corrigido em sondagem.fontes_pedidas); inicio=150, inicio=1300 e filtros precisam de nova sondagem. Sem essa prova o corte de 100 do TCU e a trava da sexta rodada ficam. Na coleta, o acesso à informação do TCM-GO (3 listas de contas irregulares e as páginas mp/id=44 e mp/id=45) e o painel das câmaras responderam 403 do próprio servidor (página padrão do nginx), por isso tcm teve 8 de 14 coletas ok; os dados abertos de contas irregulares e a jurisprudência responderam."
  trava: "testes/test_coletores_federais_nona.py::test_tcm_segue_as_paginas_ate_passar_do_comeco_do_intervalo"
