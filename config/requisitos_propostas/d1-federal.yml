- id: 154
  situacao: parcial
  evidencia: "TCU com as duas vias reais (pesquisa documentosResumidos e dados abertos). A pesquisa vai de 50 em 50 e para em 100 resultados: inicio=50 veio inteira (50 acórdãos, 42 sobre Goiânia) e inicio=100 encerrou a conexão com 100 e com 50 por página; o motor não pede além disso e diz por quê, e uma página que cai guarda as anteriores e anota o erro. TCM-GO: os dados abertos de contas irregulares (ws.tcm.go.gov.br, CSV real com 1.395 linhas, 94 de Goiânia) são lidos por tcm.contas: o órgão sai do nome do Município (GOIANIA - COMURG), Aparecida de Goiânia e Goianira não entram, e a tabela contas_irregulares_tcm ganhou CPF parcial, assunto, decisão, data do julgamento, tipo de lista e endereço do processo (banco antigo recebe as colunas sem perder linhas). A conferência transforma cada linha em alerta (com débito, alerta alto) e procura o mesmo nome entre os sócios das contratadas, como indício de possível homônimo, porque o TCM mostra só os dois primeiros dígitos do CPF e a Receita só os do meio."
  falta: "A pesquisa de jurisprudência do TCM-GO (virtual.tcmgo) ainda não devolve decisões; o acesso à informação e o painel das câmaras deram 403. A jurisprudência é um aplicativo React cujo pacote principal só traz a base da API (/jurisprudencia/api, com o cabeçalho X-Cliente: portal) e o /v1/health; as chamadas de pesquisa estão no pacote da tela (jurisprudencia-page-*.js), que a próxima sondagem (d1_tcm) baixa. No TCU, falta saber se outra ordenação traz os acórdãos mais recentes dentro dos 100."
  trava: "testes/test_coletores_federais_quarta.py::test_contas_irregulares_viram_alerta_e_o_socio_homonimo_e_indicio"
