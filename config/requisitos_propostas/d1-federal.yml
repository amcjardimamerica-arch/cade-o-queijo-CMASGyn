  falta: "Ler a segunda via do Estado. A sondagem achou, no menu real do portal da Economia, a página goias.gov.br/economia/repasse-aos-municipios/, que ainda não foi lida. Também falta saber se o CKAN do Estado libera o acesso: ele respondeu com o bloqueio do firewall."
