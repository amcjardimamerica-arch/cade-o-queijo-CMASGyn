- id: 146
  situacao: parcial
  evidencia: "Coletor onisciente/coletores/fns.py, com motor_fns, motor_fns_entidades, motor_fns_detalhe e motor_fns_repasse_dia. As entidades reais de Goiânia fecham em duas páginas de 100 (191 em 2025, 197 em 2024, todas com o IBGE 520870), entre elas o Fundo Municipal de Saúde (37.623.352/0001-03); pessoa física fica só com o CPF mascarado do FNS. Com as respostas reais do Fundo em 2025: detalhe-acao traz as 40 ações, e a soma delas é o total geral que a própria resposta declara (R$ 1.030.381.073,26 brutos, R$ 69.478.347,99 de desconto); detalhe-pagamento com acoes vazio traz todas as ordens do ano (676, em 7 páginas), cada uma com a ação (id.programaFundo.id), o mês do pagamento, o documento do SIAFI (2025OB000028) e a parcela. motor_fns_detalhe lê as ações e todas as ordens de uma vez, confere a soma das ordens de cada ação com o total dela, grava as ações em fns_acoes e só as ordens fundo a fundo em repasses_fns (os pagamentos com indicadorFundoAFundo N, documento PF e conta UNICA, ficam de fora e anotados), não grava nada se a listagem vier pela metade e não duplica quando outra via já preencheu o ano. Se a listagem não vier, lê ação por ação, como a tela. O repasse do dia nacional é lido dia a dia e fecha as somas."
