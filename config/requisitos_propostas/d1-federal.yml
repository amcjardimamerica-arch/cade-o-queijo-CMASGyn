# Propostas da Frente D1 (coletores federais) para config/requisitos_onisciente.yml.
# Nona rodada (28/11/2026): a coleta d532c1d leu o FNS e o TCM-GO de verdade. As 7 páginas das ordens do
# Fundo vieram diferentes e somaram as 676, mas com ordens repetidas entre páginas e outras faltando; o motor
# agora não conta a repetida e relê. A jurisprudência do TCM-GO respondeu (190 decisões sobre Goiânia) e o
# motor segue até o começo do intervalo. A sondagem 1e36935 saiu vazia (as fontes vieram num argumento só,
# separadas por vírgula): nada provou o TCU além de 100, que fica como está.
# Sexta rodada (28/11/2026): as entidades do FNS fecham em duas páginas (191, com o Fundo Municipal de
# Saúde), e os controladores das telas de ação e pagamento deram os parâmetros do valor por entidade: o
# motor já pede ações e ordens bancárias do Fundo, mas as respostas ainda não foram vistas (146 e 164
# parciais). A pesquisa do TCU para em 100 resultados; a da jurisprudência do TCM-GO está num pacote à parte.
# Quinta rodada (28/11/2026): o FNS por Município respondeu (consulta-detalhada/entidades, 191 entidades
# de Goiânia em 2025, filtro respeitado) e é lido; a pesquisa do TCU vai de 50 em 50. Continuam parciais
# o 146 e o 164 (falta o valor por entidade) e o 154 (falta a jurisprudência do TCM-GO).
# Quarta rodada (28/11/2026): os leitores foram ajustados às respostas reais da sondagem da branch
# claude/project-thread-m40l41, guardadas reduzidas em testes/dados/federais/*_real.*. Vão a cumprido os
# que têm trava com dado real comprovado: o FNDE (rodada 3), a Economia GO (as planilhas reais de 2025 e
# 2024, com os valores de Goiânia conferidos célula a célula) e o CEIS mais o CNEP (os dois arquivos reais
# de 27/11 lidos pelo motor). O resto continua parcial, com a falta exata.
- id: 145
  situacao: cumprido
  evidencia: "A cota do ICMS, do IPVA e do IPI-exportação é conferida como receita do Estado entregue ao Município (_cota_estadual em onisciente/conferencias/federais.py), com a via do Município (matriz de saldos, naturezas 1.7.2.1.50, 1.7.2.1.51 e 1.7.2.1.52) e a via do Estado, agora lida das planilhas reais da Economia: a página real aponta a Conciliação das Distribuições de 2025, o motor baixa só a mais nova (ela cobre o ano inteiro) e grava os 36 valores de Goiânia em repasses_estado, que a conferência lê."
  falta: ""
  trava: "testes/test_coletores_federais_quarta.py::test_motor_economia_go_com_a_pagina_e_a_conciliacao_reais_baixa_uma_planilha"
- id: 146
  situacao: parcial
  evidencia: "Coletor onisciente/coletores/fns.py, com motor_fns, motor_fns_entidades, motor_fns_detalhe e motor_fns_repasse_dia. As entidades reais de Goiânia fecham em duas páginas de 100 (191 em 2025, 197 em 2024, todas com o IBGE 520870), entre elas o Fundo Municipal de Saúde (37.623.352/0001-03); pessoa física fica só com o CPF mascarado do FNS. Com as respostas reais do Fundo em 2025: detalhe-acao traz as 40 ações, e a soma delas é o total geral que a própria resposta declara (R$ 1.030.381.073,26 brutos, R$ 69.478.347,99 de desconto); detalhe-pagamento com acoes vazio traz todas as ordens do ano (676, em 7 páginas), cada uma com a ação (id.programaFundo.id), o mês do pagamento, o documento do SIAFI (2025OB000028) e a parcela. motor_fns_detalhe lê as ações e todas as ordens de uma vez, confere a soma das ordens de cada ação com o total dela, grava as ações em fns_acoes e só as ordens fundo a fundo em repasses_fns (os pagamentos com indicadorFundoAFundo N, documento PF e conta UNICA, ficam de fora e anotados), não grava nada se a listagem vier pela metade e não duplica quando outra via já preencheu o ano. Se a listagem não vier, lê ação por ação, como a tela. O repasse do dia nacional é lido dia a dia e fecha as somas. Na coleta d532c1d, real: 197, 191 e 181 entidades em 2024, 2025 e 2026; 42, 40 e 43 ações (125 em fns_acoes); 527, 481 e 474 ordens fundo a fundo do Fundo (1.482 em repasses_fns); 777 dias do repasse nacional. A paginação da listagem repete ordens entre páginas e perde outras: a linha que reaparece em outra página não conta de novo, a listagem curta é relida (RELEITURAS_FNS) e, se ainda faltar ordem, o motor lê por ação e anota por quê."
  falta: "Provar que a listagem relida fecha sem repetição: na coleta d532c1d as 7 páginas de 2025 tinham hashes diferentes (page conta de 1 e não repete a primeira) e somaram as 676 ordens (481 fundo a fundo e 195 fora), mas com 4 ordens fundo a fundo repetidas entre páginas em 2025 (14 em 2024, 20 em 2026) e outras faltando; as repetidas explicam exatamente a diferença de várias ações (68058 em 2025: R$ 1.309.828,83, duas ordens; 69166: R$ 39.800,00; 67478: R$ 1.244,32). A diferença de R$ 5.838.778,09 da ação 61659 em 2025 não vem das ordens fundo a fundo guardadas e segue sem explicação (pode estar nas 195 ordens fora do fundo a fundo, que não são guardadas, ou nas que a paginação perdeu). A sondagem pede count=1000 (as 676 numa página) e acoes=61659; a coleta ainda não as viu."
  trava: "testes/test_coletores_federais_nona.py::test_fns_ordem_repetida_em_outra_pagina_nao_conta_e_a_releitura_traz_a_que_faltou"
