- id: 48
  situacao: parcial
  evidencia: "Conferência _emendas em conferencias/federais.py: os 70% em capital (CF, art. 166-A, § 5º) são conferidos plano de ação a plano de ação e no total do ano, pela regra EMENDA-CAPITAL do mapa legal. Os planos de transferência especial de Goiânia já são lidos do arquivo do Portal (id 150), e o motor da API lê os planos de ação assim que ela volta (trava da nova tentativa)."
