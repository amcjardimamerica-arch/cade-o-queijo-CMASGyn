- id: 150
  situacao: parcial
  evidencia: "Duas vias. A API PostgREST do Transferegov (transferegov.py) deu 503 de novo, e o motor registra isso como falha. O arquivo único de emendas do Portal da Transparência (47 MB, seis planilhas) agora é lido em fluxo, sem guardar o zip (onisciente/coletores/emendas.py). O motor lê os cabeçalhos locais do zip, descompacta aos pedaços e filtra Goiânia pelo código IBGE, pelo CNPJ ou pelo nome. Pessoas físicas ficam de fora. A tabela emendas_municipio só é trocada quando a leitura chega ao fim. No arquivo real de 28/11, isso deu 63 linhas de emendas, 34 convênios, 158 parcerias, 500 itens de plano de trabalho, 17 planos de transferência especial do Município e 6.823 favorecidos pessoa jurídica, em 4 segundos."
