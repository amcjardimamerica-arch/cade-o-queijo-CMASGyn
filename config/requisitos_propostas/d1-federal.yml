- id: 154
  situacao: parcial
  evidencia: "TCU com as duas vias reais (pesquisa documentosResumidos e dados abertos). A ordem padrão da pesquisa (DTRELEVANCIA desc) já vem da sessão mais nova para a mais antiga: as páginas reais com inicio=50 e inicio=100 vão de 28/10/2025 a 26/10/2022 sem quebrar a ordem; a ordem por ano e número encerrou a conexão. Uma página que cai guarda as anteriores e anota o erro. TCM-GO: os dados abertos de contas irregulares (ws.tcm.go.gov.br, CSV real com 1.395 linhas, 94 de Goiânia) são lidos por tcm.contas, com CPF parcial, assunto, decisão, data do julgamento, tipo de lista e endereço do processo; a conferência transforma cada linha em alerta e procura o mesmo nome entre os sócios das contratadas, como indício de possível homônimo. A jurisprudência do TCM-GO tem API (o pacote real da tela de pesquisa): motor_tcm lê buscar (texto, page, page_size, sort_by=data_sessao, com o cabeçalho X-Cliente: portal) e guarda as decisões sobre Goiânia (Aparecida de Goiânia fica de fora); se a API não responder, tenta os candidatos antigos e diz por quê. O /v1/health real respondeu healthy. Na coleta d532c1d a API respondeu de verdade: 5 páginas de 100 (uns 2 s cada), 190 decisões sobre Goiânia guardadas, com número, data da sessão, relator, colegiado e processo, de 03/09 a 27/10/2026. Como 500 decisões só cobrem uns dois meses, o motor agora segue da sessão mais nova até passar do começo do intervalo (teto tcm.PAGINAS_JURISPRUDENCIA = 80) e, se o teto parar antes, diz até onde chegou. Na sondagem a8761d9 a pesquisa do TCU passou de 100: inicio=150 (30/06/2021 a 19/10/2022) e inicio=1300 (06/04/1994 a 14/06/2000) vieram com 50 acórdãos cada, de quantidadeEncontrada 1374. O corte saiu (LIMITE_PESQUISA = None) e o motor lê até o total declarado, ou até passar do começo do intervalo, e diz quantos leu e de onde falta quando uma página cai ou o teto (60 páginas) para. Os filtros reais do TCM-GO trazem os 246 municípios (Goiânia: GOIANIA), e a tela real manda o escolhido como municipio; a busca pelo texto Goiânia traz 13.493 decisões do Estado todo (27 de Goiânia nas 100 primeiras). O motor pede primeiro pelo município, sem texto, e volta ao texto, com nota, se a primeira página não for na maior parte de Goiânia. Aparecida de Goiânia escrita sem o de (APARECIDA GOIANIA - APARECIDAPREV, como a jurisprudência real escreve) passava por Goiânia: 8 das 35 da página 1; agora fica de fora, no TCU e no TCM-GO. Na sondagem 9cc559c a busca com municipio=GOIANIA, sem texto, respondeu: 5.491 decisões (55 páginas de 100), e na página 1 92 das 100 são de Goiânia (GOIANIA - IPSM, GOIANIA, AMMA, IMAS), as outras 8 de consórcios, do próprio TCM e do MP, nenhuma de Aparecida; o motor pede por esse filtro. A página 20 respondeu HTTP 422: sem chave de API, a busca pagina só até o resultado 1000 e manda usar /acordao/jurisprudencia/exportar com os mesmos filtros. O motor agora lê no máximo as 10 primeiras páginas (tcm.RESULTADOS_SEM_CHAVE), diz que parou por esse limite e, se o servidor recusar antes, anota o motivo que a própria recusa traz (trava test_motor_tcm_para_na_pagina_10_e_diz_por_que, com a resposta real). TCU: o motor pede a pesquisa na ordem DTRELEVANCIA (cronológica, da mais nova para a mais antiga), a que deixa parar no começo do intervalo; o inicio=0 dessa ordem respondeu na coleta d532c1d na 2ª tentativa (a nova tentativa já existe em historico.Contexto.ler), e o inicio=0 que encerra a conexão nas sondagens é o da ordem ANOACORDAO, que o motor não usa (a sondagem agora pede também o inicio=0 do motor). Na sondagem 079a72d, a busca com municipio=GOIANIA e ano_votacao=2025 declarou 918 decisões (10 páginas, abaixo do limite de 1000, sem chave), e a exportação em CSV do mesmo filtro respondeu 200 com 1.876.331 bytes: 918 linhas de 17 colunas (documento, acórdão, processo, ano, data da sessão, órgão, pauta, assunto, macroassunto, relator, revisor, entidade, resultado, ODS, ementa, resumo e link do PDF), todas de 2025, de 14/01 a 17/12/2025, sem repetir documento, as 100 primeiras iguais à página 1 da busca e na mesma ordem; 873 são de Goiânia, nenhuma de Aparecida. O motor agora lê a exportação ano a ano dentro do intervalo (tcm.exportacao, com a mesma leitura da busca) e só cai na busca paginada se algum ano não vier, sem contar de novo o que já veio, e diz quais anos faltaram (trava test_motor_tcm_le_a_exportacao_ano_a_ano_sem_a_busca). O ano mais o município dispensam a chave: a exportação não tem o limite de 1000, e a busca de um ano com menos de 1000 decisões também vem inteira. Na mesma sondagem, a pesquisa do TCU deu conexão encerrada em inicio=0 (nas duas ordens) e em inicio=150, mas a sondagem lê uma vez só; o motor lê pelo historico.Contexto, que tenta 3 vezes, com espera de 5 s e 10 s (trava test_tcu_conexao_encerrada_e_lida_de_novo_com_espera_crescente), e na coleta d532c1d o TCU leu 12 de 12 chamadas com 13 tentativas. Na coleta real 6c474b1: o exportar do TCM-GO veio nos 3 anos (2026: 1.667.897 bytes, 2025: 1.876.331, 2024: 1.570.614), e o de 2025 é byte a byte o da sondagem (sha256 5bba7f5f), com as mesmas 873 decisões de Goiânia do CSV, que fecha com o total de 918 da busca; ficaram 804 de 2026 e 732 de 2024 (2.409 decisões). O motor contava 2.411 porque a mesma chave veio duas vezes numa exportação; agora conta uma vez e, entre as repetidas, fica a de Goiânia. A pesquisa do TCU leu 150 (inicio=0, 50 e 100, a de 100 byte a byte a da sondagem 079a72d, de 26/10/2022 a 02/04/2024) e parou porque passou do começo do intervalo; 79 dos 150 acórdãos são de 11/2024 em diante, e nada do intervalo faltou. Os dados abertos do TCU recusaram inicio=200 com HTTP 429 nas 3 tentativas, em 106,6 s, que são as esperas sem Retry-After (15, 30 e 60 s) mais as leituras: o servidor não disse quanto esperar. O motor agora espera mais 2 minutos (tcu.ESPERA_429) e lê a página uma vez mais, e a nota diz se o servidor pediu espera."
  falta: "O total da busca do TCM-GO para 2024 e 2026 (a sondagem d1_tcm agora pede), para conferir as 732 e 804 decisões desses anos como a de 2025 foi conferida. Os dados abertos do TCU com a nova leitura depois do 429 ainda não rodaram numa coleta. O acesso à informação do TCM-GO (3 listas, mp/id=44 e mp/id=45) e o painel das câmaras respondem 403 do próprio servidor (as contas irregulares vêm dos dados abertos)."
  trava: "testes/test_coletores_federais_decima.py::test_tcu_pesquisa_le_ate_o_total_e_diz_o_que_faltou"
