- id: 154
  situacao: parcial
  evidencia: "TCU com as duas vias reais (pesquisa documentosResumidos e dados abertos). A ordem padrão da pesquisa (DTRELEVANCIA desc) já vem da sessão mais nova para a mais antiga: as páginas reais com inicio=50 e inicio=100 vão de 28/10/2025 a 26/10/2022 sem quebrar a ordem; a ordem por ano e número encerrou a conexão. Uma página que cai guarda as anteriores e anota o erro. TCM-GO: os dados abertos de contas irregulares (ws.tcm.go.gov.br, CSV real com 1.395 linhas, 94 de Goiânia) são lidos por tcm.contas, com CPF parcial, assunto, decisão, data do julgamento, tipo de lista e endereço do processo; a conferência transforma cada linha em alerta e procura o mesmo nome entre os sócios das contratadas, como indício de possível homônimo. A jurisprudência do TCM-GO tem API (o pacote real da tela de pesquisa): motor_tcm lê buscar (texto, page, page_size, sort_by=data_sessao, com o cabeçalho X-Cliente: portal) e guarda as decisões sobre Goiânia (Aparecida de Goiânia fica de fora); se a API não responder, tenta os candidatos antigos e diz por quê. O /v1/health real respondeu healthy. Na coleta d532c1d a API respondeu de verdade: 5 páginas de 100 (uns 2 s cada), 190 decisões sobre Goiânia guardadas, com número, data da sessão, relator, colegiado e processo, de 03/09 a 27/10/2026. Como 500 decisões só cobrem uns dois meses, o motor agora segue da sessão mais nova até passar do começo do intervalo (teto tcm.PAGINAS_JURISPRUDENCIA = 80) e, se o teto parar antes, diz até onde chegou. Na sondagem a8761d9 a pesquisa do TCU passou de 100: inicio=150 (30/06/2021 a 19/10/2022) e inicio=1300 (06/04/1994 a 14/06/2000) vieram com 50 acórdãos cada, de quantidadeEncontrada 1374. O corte saiu (LIMITE_PESQUISA = None) e o motor lê até o total declarado, ou até passar do começo do intervalo, e diz quantos leu e de onde falta quando uma página cai ou o teto (60 páginas) para. Os filtros reais do TCM-GO trazem os 246 municípios (Goiânia: GOIANIA), e a tela real manda o escolhido como municipio; a busca pelo texto Goiânia traz 13.493 decisões do Estado todo (27 de Goiânia nas 100 primeiras). O motor pede primeiro pelo município, sem texto, e volta ao texto, com nota, se a primeira página não for na maior parte de Goiânia. Aparecida de Goiânia escrita sem o de (APARECIDA GOIANIA - APARECIDAPREV, como a jurisprudência real escreve) passava por Goiânia: 8 das 35 da página 1; agora fica de fora, no TCU e no TCM-GO. Na sondagem 9cc559c a busca com municipio=GOIANIA, sem texto, respondeu: 5.491 decisões (55 páginas de 100), e na página 1 92 das 100 são de Goiânia (GOIANIA - IPSM, GOIANIA, AMMA, IMAS), as outras 8 de consórcios, do próprio TCM e do MP, nenhuma de Aparecida; o motor pede por esse filtro. A página 20 respondeu HTTP 422: sem chave de API, a busca pagina só até o resultado 1000 e manda usar /acordao/jurisprudencia/exportar com os mesmos filtros. O motor agora lê no máximo as 10 primeiras páginas (tcm.RESULTADOS_SEM_CHAVE), diz que parou por esse limite e, se o servidor recusar antes, anota o motivo que a própria recusa traz (trava test_motor_tcm_para_na_pagina_10_e_diz_por_que, com a resposta real). TCU: o motor pede a pesquisa na ordem DTRELEVANCIA (cronológica, da mais nova para a mais antiga), a que deixa parar no começo do intervalo; o inicio=0 dessa ordem respondeu na coleta d532c1d na 2ª tentativa (a nova tentativa já existe em historico.Contexto.ler), e o inicio=0 que encerra a conexão nas sondagens é o da ordem ANOACORDAO, que o motor não usa (a sondagem agora pede também o inicio=0 do motor)."
  falta: "Sem chave de API, a jurisprudência do TCM-GO só dá as 1.000 decisões mais novas de Goiânia (de 5.491, uns meses): o resto exige /exportar (CSV, com os mesmos filtros) ou uma busca por ano da votação, que a sondagem d1_tcm pede agora (municipio=GOIANIA com ano_votacao=2025, em buscar e em exportar) e ainda não foi lida; a chave de API é por chamado ao TCM-GO. As decisões do TCM-GO gravadas na coleta d532c1d (190) incluem as de Aparecida escritas sem o de; a próxima coleta as tira. O acesso à informação do TCM-GO (3 listas, mp/id=44 e mp/id=45) e o painel das câmaras respondem 403 do próprio servidor."
  trava: "testes/test_coletores_federais_decima.py::test_tcu_pesquisa_le_ate_o_total_e_diz_o_que_faltou"
- id: 164
  situacao: parcial
  evidencia: "O FNDE está lido no formato real (id 147). O FNS lê as entidades reais de Goiânia (191 em 2025, 197 em 2024) e o valor pago ao Fundo Municipal de Saúde pelas respostas reais: as 40 ações de 2025 fecham com o total geral declarado, e as ordens trazem a ação, o mês do pagamento e o documento do SIAFI (id 146). O repasse do dia real também é lido. Na sondagem 9cc559c as ordens do ano vieram numa página só com count=1000, que o motor agora pede, e as ordens reais da ação 61659 fecham com o total dela ao sair a ordem rejeitada (2025OB016558, motivoRejeicao de cancelamento parcial), que fica fora do pago e de repasses_fns."
  falta: "A ativação dos domínios pela Frente D2 e a listagem das ordens vista inteira (id 146): a página de 1000 ainda não foi guardada inteira (a sondagem cortava em 600 KB), e falta uma coleta com count=1000 que feche todas as ações de 2024 a 2026 com o total de cada uma."
  trava: "testes/test_coletores_federais_setima.py::test_fns_acoes_reais_do_fundo_fecham_com_o_total_geral"
