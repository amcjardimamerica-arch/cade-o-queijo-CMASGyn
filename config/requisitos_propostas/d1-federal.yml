- id: 146
  situacao: parcial
  evidencia: "Coletor onisciente/coletores/fns.py, com motor_fns, motor_fns_entidades, motor_fns_detalhe e motor_fns_repasse_dia. As entidades reais de Goiânia (consulta-detalhada/entidades com estado e município) fecham em duas páginas de 100: 191 em 2025, todas com o IBGE 520870, entre elas o Fundo Municipal de Saúde (37.623.352/0001-03, esfera MUNICIPAL); pessoa física fica só com o CPF mascarado do FNS. Com os parâmetros dos controladores reais (acaoController.js e pagamentoController.js), motor_fns_detalhe pede, para cada entidade municipal, as ações do ano (detalhe-acao com cpfCnpjUg) e as ordens bancárias de cada ação com valor (detalhe-pagamento com acoes), confere a soma das ordens com o total da ação, grava as ações em fns_acoes e as ordens em repasses_fns (sem duplicar quando outra via já preencheu o ano). O repasse do dia nacional é lido dia a dia e fecha as somas."
  falta: "Ver as respostas reais de detalhe-acao e detalhe-pagamento do Fundo (a próxima sondagem d1_fns as pede); o teste do motor usa respostas montadas com os campos dos controladores. Se a ordem bancária vier sem data, falta a data para a conferência mês a mês."
  trava: "testes/test_coletores_federais_sexta.py::test_motor_fns_detalhe_le_acoes_e_ordens_do_fundo_e_confere_a_soma"
