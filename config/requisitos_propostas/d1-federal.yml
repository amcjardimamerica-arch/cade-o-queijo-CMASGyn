# Propostas da Frente D1 (coletores federais) para config/requisitos_onisciente.yml.
# Décima primeira rodada (28/11/2026): a sondagem de 07:40Z (9cc559c) leu count=1000: as ordens do Fundo
# em 2025 vêm numa página só (691.235 bytes; o recorte guardado de 587 ordens não repete nenhuma e contém as
# páginas 1 e 2 de 100), e o motor passou a pedir assim. A diferença de R$ 5.838.778,09 da ação 61659 fechou:
# é a ordem 2025OB016558, com motivoRejeicao de cancelamento parcial, que agora fica fora do pago. O filtro
# municipio=GOIANIA do TCM-GO vale (92 das 100 de Goiânia, nenhuma de Aparecida), mas sem chave de API a busca
# pagina só até o resultado 1000 (HTTP 422 na página 20): o motor para na página 10 e diz por quê.
# Décima rodada (28/11/2026): a sondagem de 06:50Z (a8761d9) provou a pesquisa do TCU além de 100
# (inicio=150 e inicio=1300, de 1.374 resultados): o corte saiu e o motor lê até o total. Os filtros do TCM-GO
# trazem o município (GOIANIA) e o motor pede por ele, com volta ao texto se o filtro não valer; Aparecida de
# Goiânia escrita sem o "de" deixou de passar por Goiânia. As páginas 1, 2 e 7 do FNS vieram iguais às da
# coleta (a repetição é fixa) e o filtro por ação respondeu (166 ordens da 61659); count=1000 ainda não foi lido.
# Nona rodada (28/11/2026): a coleta d532c1d leu o FNS e o TCM-GO de verdade. As 7 páginas das ordens do
# Fundo vieram diferentes e somaram as 676, mas com ordens repetidas entre páginas e outras faltando; o motor
# agora não conta a repetida e relê. A jurisprudência do TCM-GO respondeu (190 decisões sobre Goiânia) e o
# motor segue até o começo do intervalo. A sondagem 1e36935 saiu vazia (as fontes vieram num argumento só,
# separadas por vírgula): nada provou o TCU além de 100, que fica como está.
# Sexta rodada (28/11/2026): as entidades do FNS fecham em duas páginas (191, com o Fundo Municipal de
# Saúde), e os controladores das telas de ação e pagamento deram os parâmetros do valor por entidade: o
# motor já pede ações e ordens bancárias do Fundo, mas as respostas ainda não foram vistas (146 e 164
# parciais). A pesquisa do TCU para em 100 resultados; a da jurisprudência do TCM-GO está num pacote à parte.
# Quinta rodada (28/11/2026): o FNS por Município respondeu (consulta-detalhada/entidades, 191 entidades
# de Goiânia em 2025, filtro respeitado) e é lido; a pesquisa do TCU vai de 50 em 50. Continuam parciais
# o 146 e o 164 (falta o valor por entidade) e o 154 (falta a jurisprudência do TCM-GO).
# Quarta rodada (28/11/2026): os leitores foram ajustados às respostas reais da sondagem da branch
# claude/project-thread-m40l41, guardadas reduzidas em testes/dados/federais/*_real.*. Vão a cumprido os
# que têm trava com dado real comprovado: o FNDE (rodada 3), a Economia GO (as planilhas reais de 2025 e
# 2024, com os valores de Goiânia conferidos célula a célula) e o CEIS mais o CNEP (os dois arquivos reais
# de 27/11 lidos pelo motor). O resto continua parcial, com a falta exata.
- id: 145
  situacao: cumprido
  evidencia: "A cota do ICMS, do IPVA e do IPI-exportação é conferida como receita do Estado entregue ao Município (_cota_estadual em onisciente/conferencias/federais.py), com a via do Município (matriz de saldos, naturezas 1.7.2.1.50, 1.7.2.1.51 e 1.7.2.1.52) e a via do Estado, agora lida das planilhas reais da Economia: a página real aponta a Conciliação das Distribuições de 2025, o motor baixa só a mais nova (ela cobre o ano inteiro) e grava os 36 valores de Goiânia em repasses_estado, que a conferência lê."
  falta: ""
  trava: "testes/test_coletores_federais_quarta.py::test_motor_economia_go_com_a_pagina_e_a_conciliacao_reais_baixa_uma_planilha"
- id: 146
  situacao: parcial
  evidencia: "Coletor onisciente/coletores/fns.py, com motor_fns, motor_fns_entidades, motor_fns_detalhe e motor_fns_repasse_dia. As entidades reais de Goiânia fecham em duas páginas de 100 (191 em 2025, 197 em 2024, todas com o IBGE 520870), entre elas o Fundo Municipal de Saúde (37.623.352/0001-03); pessoa física fica só com o CPF mascarado do FNS. Com as respostas reais do Fundo em 2025: detalhe-acao traz as 40 ações, e a soma delas é o total geral que a própria resposta declara (R$ 1.030.381.073,26 brutos, R$ 69.478.347,99 de desconto); detalhe-pagamento com acoes vazio traz todas as ordens do ano (676, em 7 páginas), cada uma com a ação (id.programaFundo.id), o mês do pagamento, o documento do SIAFI (2025OB000028) e a parcela. motor_fns_detalhe lê as ações e todas as ordens de uma vez, confere a soma das ordens de cada ação com o total dela, grava as ações em fns_acoes e só as ordens fundo a fundo em repasses_fns (os pagamentos com indicadorFundoAFundo N, documento PF e conta UNICA, ficam de fora e anotados), não grava nada se a listagem vier pela metade e não duplica quando outra via já preencheu o ano. Se a listagem não vier, lê ação por ação, como a tela. O repasse do dia nacional é lido dia a dia e fecha as somas. Na coleta d532c1d, real: 197, 191 e 181 entidades em 2024, 2025 e 2026; 42, 40 e 43 ações (125 em fns_acoes); 527, 481 e 474 ordens fundo a fundo do Fundo (1.482 em repasses_fns); 777 dias do repasse nacional. A paginação da listagem repete ordens entre páginas e perde outras: a linha que reaparece em outra página não conta de novo, a listagem curta é relida (RELEITURAS_FNS) e, se ainda faltar ordem, o motor lê por ação e anota por quê. Na sondagem a8761d9, as páginas 1, 2 e 7 da listagem de 2025 vieram byte a byte iguais às da coleta (sha256 b773ee82, dee7cb79, f0bc6bcb, 35 minutos depois): a repetição de ordens entre páginas é fixa, por isso fica uma releitura só (RELEITURAS_FNS = 1) antes de ir por ação. O filtro por ação respondeu de verdade: acoes=61659 trouxe só ordens da ação 61659, 166 no total, em 2 páginas (a 1: 100 ordens, 27 fundo a fundo, R$ 427.949.655,59). Na sondagem 9cc559c, count=1000 trouxe a listagem de 2025 numa página só, de 691.235 bytes: o recorte guardado (os primeiros 600 KB, 587 ordens inteiras) não repete nenhuma ordem, começa pelas 100 da página 1 na mesma ordem e contém todas as da página 2; o motor agora pede as ordens com count=1000 (fns.POR_PAGINA_PAGAMENTOS), uma leitura por ano, e a releitura fica de reserva. A página 2 de acoes=61659 mostrou que, com 100 por página, o filtro por ação também repete (6 ordens) e perde outras 6; as 160 únicas mais as 6 que só a página de 1000 trouxe dão as 166 ordens da ação, que somam R$ 669.552.284,15. A diferença de R$ 5.838.778,09 é uma ordem só, a 2025OB016558 (fundo a fundo, portaria 6464), com motivoRejeicao de cancelamento parcial por comando do gestor: sem ela, as ordens dão exatamente os R$ 663.713.506,06 que detalhe-acao declara para a ação. O leitor guarda o motivoRejeicao, e o motor tira a ordem rejeitada do pago e de repasses_fns, com nota, nos dois caminhos (listagem e por ação)."
  falta: "A página de 1000 ainda não foi vista inteira: a sondagem guardava só 600 KB, e as 676 ordens do ano (a página 1 de 100 declara 676) não couberam; com d1_fns entre as fontes grandes, a próxima sondagem guarda a resposta inteira. Falta também uma coleta com count=1000 que feche as 40 ações de 2025 (e as de 2024 e 2026) com o total de cada uma. O detalhar-pagamento-dia do repasse do dia segue com erro 500 do servidor."
  trava: "testes/test_coletores_federais_decima_primeira.py::test_fns_acao_61659_fecha_com_o_total_quando_a_ordem_rejeitada_sai"
