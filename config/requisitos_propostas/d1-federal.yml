  evidencia: "Duas vias. O arquivo único de emendas do Portal da Transparência é lido em fluxo (onisciente/coletores/emendas.py): no arquivo real de 28/11, 63 emendas, 34 convênios, 158 parcerias, 500 itens de plano de trabalho, 17 planos de transferência especial e 6.823 favorecidos pessoa jurídica de Goiânia. A API do Transferegov deu 503 e o repositório de dados abertos deu 404 na quarta rodada. O motor agora tolera a queda: com a raiz e a primeira consulta fora do ar, não insiste em cada tabela e CNPJ, tenta o módulo de novo no fim do motor e, se continuar fora, grava falha dizendo que a próxima rodada tenta outra vez; as emendas do Portal não dependem disso."
