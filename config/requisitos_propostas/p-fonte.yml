# Propostas da Frente P (o dado como a fonte publica) para config/requisitos_onisciente.yml e
# config/requisitos_ampliacao.yml. 141, 146, 172 e 226 já aplicadas pelo coordenador em 28/11/2026 nos arquivos de origem. Decisão do usuário de 28/11/2026, 11:18Z (config/decisoes_usuario.yml, P-01):
# "Os dados devem ser públicos e não mascarar. Caso fossem necessário mascarar deveriam ter sido feito na fonte."
# Revoga a máscara do CPF (b8bf2e6, 24fc099, ee68c14, 91240af, e98f23e) e a retirada das folhas do rastreio
# (69017a5). O coordenador aplica:
#   141 e 146: trocar as frases indicadas em "trocar" (o resto da evidência fica como está);
#   172: a evidência inteira;
#   226: acrescentar a nota ao bloco de comentários de config/requisitos_propostas/h-rastreio.yml e a frase final
#        à evidência;
#   227: item novo ao fim de config/requisitos_ampliacao.yml.
# 174 (pessoal.html "sem nomes nem CPF") não muda: a tela mostra contagens, não pessoas, e não esconde dado
# nenhum da fonte. 149 (credor recorrente) continua deixando de fora o documento mascarado; depois da restauração
