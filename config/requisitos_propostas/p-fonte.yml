- id: 227
  bloco: 'P: o dado como a fonte publica, 28/11/2026'
  requisito: Os dados devem ser públicos e não mascarar; nenhuma informação ou dado da fonte é modificado, para cruzar e individualizar
    quem recebe o recurso público sem homônimo nem terceiro inocente (decisão do usuário de 28/11/2026, 11:18Z).
  situacao: parcial
  evidencia: 'config/decisoes_usuario.yml (P-01) com o texto, a regra, o que revoga e as travas. Banco.inserir, Banco.abrir,
    os coletores (goiania_transweb, impedimentos, fns, sancoes, tcm, tcu, transferegov), a sondagem e as telas guardam e mostram
    o dado como a fonte publica, sem máscara e sem corte de texto; o CPF inteiro casa pelo CPF inteiro. python -m onisciente
    restaurar-fonte --de 07e130c devolve o que o sistema mascarou, cada linha provada pelo hash do rastreio antigo (ou pela
    linha antiga que só difere na proveniência), e lista o que não tem original. Na cópia do banco de 28/11/2026: 18.901 linhas
    voltaram (contratacoes_pncp 19, contratos_pncp 925, despesa_eventos 7.840, emendas_municipio 21, pncp_itens 983, sancoes
    9.113), nenhuma ambígua nem sem prova, 95.123 folhas retiradas voltaram provadas pela raiz, e a verificação ficou íntegra.
    Os 16 arquivos da sondagem que o sistema mascarou voltaram à versão que a coleta gravou. No banco real, em 28/11/2026:
    restaurar-fonte --gravar devolveu as mesmas 18.901 linhas e as 95.123 folhas, e python -m onisciente rastreio ficou íntegro.'
  falta: 'Ler de novo da fonte o que foi coletado já mascarado: a despesa de Goiânia (7.755 linhas com o documento mascarado,
