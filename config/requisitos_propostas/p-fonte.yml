    (a próxima sondagem). Quando o banco real estiver limpo, a trava xfail estrita test_banco_real_sem_nada_mascarado_pelo_sistema
    passa e a marca xfail sai.'
  trava: testes/test_dado_da_fonte.py::test_nenhum_modulo_chama_a_mascara_nem_abre_rodada_de_mascara_ou_retirada
