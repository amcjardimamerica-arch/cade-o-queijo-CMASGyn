# REGRAS DE CONFORMIDADE
# Cada regra tem `motor`: `deterministico` roda em Python sem custo de token;
# `modelo` só é acionada quando a determinística acusa suspeita.
# Ordem obrigatória: determinístico primeiro, modelo depois. Nunca o inverso.

regras:

  # ================= PUBLICIDADE DAS ATAS =================
  - id: ATA-01
    titulo: "Ata de plenária publicada dentro do prazo do Regimento Interno"
    motor: deterministico
    descricao: >
      Cruza o calendário de reuniões divulgado pelo CMASGyn com as atas
      efetivamente publicadas. Reunião realizada sem ata publicada após o
      prazo regimental gera achado.
    parametros:
      prazo_dias: 30           # AJUSTAR ao artigo do Regimento Interno após leitura do corpus
      fonte_calendario: "cmasgyn_plenarias"
    fundamento: ["Regimento Interno do CMASGyn", "Lei 12.527/2011, art. 8º"]

  - id: ATA-02
    titulo: "Ata acessível sem autenticação e em formato legível"
    motor: deterministico
    descricao: >
      Verifica se o arquivo responde 200 sem sessão, se é PDF com camada de
      texto e se não está protegido contra extração.
    fundamento: ["Lei 12.527/2011, art. 8º, § 3º, II e III"]

  - id: ATA-03
    titulo: "Conteúdo mínimo da ata"
    motor: modelo
    nivel: extracao
    descricao: >
      Extrai data, quórum, pauta, deliberações e votação nominal. Ausência de
      quórum registrado ou de resultado de votação gera achado.
    fundamento: ["Regimento Interno do CMASGyn"]

  # ================= RESOLUÇÕES =================
  - id: RES-01
    titulo: "Continuidade da numeração das resoluções"
    motor: deterministico
    descricao: >
      Detecta saltos na sequência numérica por exercício. Lacuna indica
      resolução não publicada.
    fundamento: ["Lei 12.527/2011, art. 8º"]

  - id: RES-02
    titulo: "Publicação da resolução no Diário Oficial do Município"
    motor: deterministico
    descricao: >
      Toda resolução localizada no sítio do conselho deve ter correspondente
      no DOM. A ausência compromete a eficácia do ato.
    fundamento: ["Constituição Federal, art. 37, caput", "Decreto municipal 3.987/2013"]

  - id: RES-03
    titulo: "Alteração silenciosa de ato já publicado"
    motor: deterministico
    descricao: >
      Compara o SHA-256 de cada arquivo com a versão anterior arquivada.
      Divergência sem nova numeração ou errata é achado de severidade alta.
    severidade_padrao: alta

  - id: RES-04
    titulo: "Pertinência temática da resolução"
    motor: modelo
    nivel: validacao
    descricao: >
      Confronta o objeto da resolução com o rol de competências do CMASGyn.
      Aponta extrapolação de competência ou matéria estranha ao conselho.
    fundamento: ["Lei 8.742/1993, arts. 16 e 17", "Lei 7.532/1995", "Regimento Interno do CMASGyn"]

  - id: RES-05
    titulo: "Respaldo jurídico e fundamentação"
    motor: modelo
    nivel: validacao
    descricao: >
      Verifica se a resolução invoca norma vigente. Sinaliza quando a base
      citada foi revogada, quando não há base declarada, ou quando a norma
      federal invocada não sustenta o dispositivo municipal.
    fundamento: ["Lei 9.784/1999, art. 50", "corpus normativo local"]

  - id: RES-06
    titulo: "Padronização com norma federal"
    motor: modelo
    nivel: validacao
    descricao: >
      Compara o ato municipal com a resolução do CNAS correspondente.
      Aponta divergência de prazo, percentual, procedimento ou nomenclatura.
    fundamento: ["Resoluções do CNAS no corpus"]

  # ================= INSCRIÇÃO DE ENTIDADES =================
  - id: ENT-01
    titulo: "Motivação do deferimento ou indeferimento"
    motor: modelo
    nivel: validacao
    descricao: >
      Ato que defere ou indefere inscrição sem motivação expressa e sem
      indicação do requisito descumprido.
    fundamento: ["Resolução CNAS 14/2014", "Lei 9.784/1999, art. 50, I"]

  - id: ENT-02
    titulo: "Coerência entre entidade inscrita e execução orçamentária"
    motor: deterministico
    descricao: >
      Entidade que recebe repasse do FMAS sem inscrição vigente no conselho,
      ou inscrição sem correspondente no CNEAS.

  # ================= IGD / CONTROLE SOCIAL =================
  - id: IGD-01
    titulo: "Percentual mínimo destinado ao controle social"
    motor: deterministico
    descricao: >
      Confere se o município destinou ao CMASGyn o percentual mínimo do
      IGD-PBF e do IGD-SUAS. Até o exercício de 2025 o piso é de 3%; a partir
      de janeiro de 2026 o piso passa a 10%.
    parametros:
      piso_ate_2025: 0.03
      piso_desde_2026: 0.10
    fundamento:
      - "Resolução CNAS/MDS 202/2025, art. 6º — mínimo de 10% do IGD/SUAS e IGD/PBF"
      - "Portaria MDS 1.041/2024, art. 11, § 1º — mínimo de 3%"
      - "Resolução CNAS 33/2012, art. 121, VII"
    nota: >
      A Resolução 202/2025 revogou a Resolução CNAS 15/2014 e prevalece sobre
      a diretriz anterior de 3%. Registre-se, porém, que a Portaria MDS
      1.041/2024 ainda enuncia 3% — antinomia a ser explorada ou arguida
      conforme o interesse do caso.

  - id: IGD-02
    titulo: "Dotação orçamentária específica de fortalecimento do controle social"
    motor: deterministico
    descricao: >
      A partir do exercício de 2026 o Quadro de Detalhamento de Despesas deve
      conter dotação própria para o CMASGyn. Busca na LOA e no QDD do corpus.
    fundamento: ["Resolução CNAS/MDS 202/2025"]

  - id: IGD-03
    titulo: "Prestação de contas quadrimestral ao conselho"
    motor: deterministico
    descricao: >
      Verifica a existência de três prestações de contas por exercício a
      partir de 2026, e a deliberação do conselho sobre cada uma.
    parametros:
      periodicidade_meses: 4
    fundamento: ["Resolução CNAS/MDS 202/2025"]

  - id: IGD-04
    titulo: "Transparência ativa da aplicação do IGD"
    motor: deterministico
    descricao: >
      Se nem o portal da transparência, nem o DOM, nem o sítio do conselho
      publicam o plano de aplicação e a execução do IGD, o achado é a própria
      opacidade — e enseja pedido fundado na Lei 12.527/2011.
    saida_sugerida: "minuta_lai"

  - id: IGD-05
    titulo: "Saldo acumulado sem reprogramação"
    motor: modelo
    nivel: extracao
    descricao: >
      Extrai saldo em conta do IGD-PBF e do IGD-SUAS dos demonstrativos e
      sinaliza acúmulo sem plano de reprogramação aprovado.

  # ================= FUNDO E PARCERIAS =================
  - id: FIN-01
    titulo: "Ato de execução do FMAS sem deliberação prévia do conselho"
    motor: modelo
    nivel: validacao
    descricao: >
      Empenho, convênio ou termo de fomento publicado no DOM sem resolução
      aprovatória anterior no acervo do CMASGyn.
    fundamento: ["Lei 8.742/1993, art. 30", "Lei 8.248/2004"]

  - id: FIN-02
    titulo: "Convocação da conferência municipal no biênio"
    motor: deterministico
    descricao: >
      Decurso do biênio sem ato de convocação da Conferência Municipal de
      Assistência Social.
    fundamento: ["Lei 8.742/1993", "Lei 7.532/1995"]

severidades:
  alta: "Vício com potencial de nulidade ou de dano ao erário. Gera dossiê completo."
  media: "Irregularidade formal relevante. Gera achado e minuta de ofício."
  baixa: "Registro para acompanhamento. Não gera peça."
