# Onde cada dado está declarado. Verificado em 27/08/2026.
# Regra: só entra endereço testado. Portal que responde 503 fica registrado como
# morto, com o substituto ao lado — para que ninguém conclua que o dado não existe.
versao: "1.0"

federal:
  repasses_fundo_a_fundo:
    nome: "Extração dos valores repassados — Fundo Nacional de Assistência Social"
    url: "https://fnas.mds.gov.br/extracao-dos-valores-repassados-fundo-a-fundo/"
    formato: "planilha por exercício, sem autenticação"
    traz: [municipio, bloco, programa, competencia, valor, ordem_bancaria_siafi]
    status: FUNCIONA
    usado_por: src/coleta_federal.py
    valor: "É o lado da União na conciliação. Traz o IGD competência a competência,
             que é a base do piso de 10% do artigo 6º da Resolução CNAS/MDS 202/2025."
  prestacao_de_contas:
    nome: "Painel de preenchimento de prestação de contas"
    url: "https://paineis.mds.gov.br/public/extensions/Preenchimento_de_Prestacao_de_Contas/"
    status: A_TESTAR
  cadsuas:
    nome: "CadSUAS — consulta externa"
    url: "https://aplicacoes.mds.gov.br/cadsuas/visualizarConsultaExterna.html"
    traz: [orgao_gestor, fundo, conselho, composicao, unidades]
    status: A_TESTAR
    valor: "Confirma a composição do Conselho e a existência da Secretaria Executiva."
  cneas:
    nome: "Cadastro Nacional de Entidades de Assistência Social"
    url: "https://aplicacoes.mds.gov.br/cneas/publico/xhtml/consultapublica/pesquisar.jsf"
    traz: [entidade, inscricao_no_conselho, servicos_ofertados]
    status: A_TESTAR
    valor: "Confere se a entidade que recebe repasse está inscrita, como exige o
             artigo 5º da Lei municipal 7.531/1995 e a Resolução CNAS 14/2014."
  transparencia_federal:
    nome: "Portal da Transparência da União — transferências"
    url: "https://portaldatransparencia.gov.br/transferencias/consulta"
    status: FUNCIONA
  mortos:
    - {url: "https://aplicacoes.mds.gov.br/sagi/FV/parcelas.php", erro: 503, substituto: repasses_fundo_a_fundo}
    - {url: "https://aplicacoes.mds.gov.br/suaswebcons/restrito/execute.jsf", erro: 503, substituto: repasses_fundo_a_fundo}
    - {url: "https://www.gov.br/participamaisbrasil", erro: "plataforma encerrada", substituto: "Diário Oficial da União"}

