# LÉXICO DE GATILHO — filtro determinístico executado ANTES de qualquer chamada ao modelo.
# Nenhum texto sobe ao LLM sem casar aqui. Este é o principal mecanismo de economia.
#
# `peso` orienta a prioridade quando o orçamento de tokens estiver apertado.
# `janela` é o recorte em caracteres ao redor do acerto que será enviado ao modelo.

janela_padrao: 1800        # caracteres antes+depois do acerto
janela_maxima: 6000

# Um trecho só é preservado se casar em ao menos um grupo marcado `ancora: true`.
# Grupos não-âncora (orgao_gestor, parcerias) apenas enriquecem o contexto.
exigir_ancora: true        # teto por trecho, ainda que haja acertos contíguos

grupos:

  conselho:
    ancora: true
    peso: 10
    janela: 2500
    padroes:
      - "CMAS ?Gyn"
      - "CMAS[/ -]?GYN"
      - "Conselho Municipal de Assist[êe]ncia Social"
      - "Conselho Municipal de Assist\\. Social"
      - "(?-i:\\bCMAS\\b)"
      - "Confer[êe]ncia Municipal de Assist[êe]ncia Social"
      - "Lei n?[.º°]? ?7\\.?532[/ ]?1?9?95"

  fundo_e_financas:
    ancora: true
    peso: 9
    janela: 2500
    padroes:
      - "Fundo Municipal de Assist[êe]ncia Social"
      - "(?-i:\\bFMAS\\b)"
      - "(?-i:\\bIGD[- ]?(?:M|PBF|SUAS)\\b)"
      - "[ÍI]ndice de Gest[ãa]o Descentralizada"
      - "Bolsa Fam[íi]lia"
      - "Cadastro [ÚU]nico|CadÚnico|Cad[ÚU]nico"
      - "cofinanciamento"
      - "presta[çc][ãa]o de contas d[oe][s]? (?:recursos |Fundo|IGD)"
      - "plano de a[çc][ãa]o"
      - "SuasWeb"

  orgao_gestor:
    peso: 7
    janela: 1800
    padroes:
      - "Secretaria Municipal de Assist[êe]ncia Social"
      - "(?-i:\\bSEMAS\\b)"
      - "(?-i:\\bSUAS\\b)"
      - "(?-i:\\bCRAS\\b|\\bCREAS\\b)"
      - "prote[çc][ãa]o social (b[áa]sica|especial)"
      - "benef[íi]cio(s)? eventua(l|is)"

  parcerias:
    peso: 8
    janela: 2200
    padroes:
      - "termo de (fomento|colabora[çc][ãa]o)"
      - "acordo de coopera[çc][ãa]o"
      - "chamamento p[úu]blico"
      - "Lei n?[.º°]? ?13\\.?019"
      - "Lei n?[.º°]? ?8\\.?248"
      - "organiza[çc][ãa]o da sociedade civil|(?-i:\\bOSC\\b)"
      - "emenda parlamentar"

  inscricao_entidades:
    ancora: true
    peso: 9
    janela: 2500
    padroes:
      - "inscri[çc][ãa]o (de|da) entidade"
      - "deferimento|indeferimento"
      - "(?-i:\\bCNEAS\\b|\\bCadSUAS\\b)"
      - "(?-i:\\bCEBAS\\b)"
      - "Resolu[çc][ãa]o CNAS n?[.º°]? ?14"

  # Preenchido automaticamente por src/coleta_cmasgyn.py a partir da página
  # de Entidades Inscritas. NÃO editar à mão — é sobrescrito a cada semana.
  entidades_inscritas:
    ancora: true
    peso: 10
    janela: 2200
    gerado: true
    arquivo: "config/termos_entidades.yml"

# Anti-ruído: acertos que casam SÓ com estes padrões são descartados sem ir ao modelo.
exclusoes:
  - "Conselho Municipal de Sa[úu]de"
  - "Conselho Municipal de Educa[çc][ãa]o"
  - "Conselho Tutelar"
  - "Conselho Municipal dos Direitos da Crian[çc]a"

# LGPD: descarte na ingestão. Nunca persistir nem enviar ao modelo.
# (Art. 5º, I e II, da Lei 13.709/2018 — foco exclusivo em pessoas jurídicas e atos.)
redacao_pessoal:
  - nome: cpf
    padrao: "\\b\\d{3}\\.?\\d{3}\\.?\\d{3}-?\\d{2}\\b"
    substituto: "[CPF-SUPRIMIDO]"
  - nome: nis
    padrao: "\\bNIS ?n?[.º°]? ?\\d[\\d.\\- ]{8,}\\b"
    substituto: "[NIS-SUPRIMIDO]"
  - nome: rg
    padrao: "\\bRG ?n?[.º°]? ?[\\d.\\-]{5,}\\b"
    substituto: "[RG-SUPRIMIDO]"
  - nome: telefone
    padrao: "\\(\\d{2}\\) ?9?\\d{4}-?\\d{4}"
    substituto: "[TEL-SUPRIMIDO]"
  - nome: email
    padrao: "[\\w.+-]+@[\\w-]+\\.[\\w.]+"
    substituto: "[EMAIL-SUPRIMIDO]"
  - nome: beneficiario
    padrao: "benefici[áa]ri[oa]s?:? [A-ZÁÉÍÓÚÂÊÔÃÕÇ][a-zâêôãõáéíóúç]+(?: [A-ZÁÉÍÓÚÂÊÔÃÕÇ][a-zâêôãõáéíóúç]+){1,4}"
    substituto: "beneficiário [NOME-SUPRIMIDO]"

# CNPJ é dado de pessoa jurídica: PRESERVAR. Serve de chave das entidades.
preservar:
  - nome: cnpj
    padrao: "\\b\\d{2}\\.?\\d{3}\\.?\\d{3}/?\\d{4}-?\\d{2}\\b"
