# varejo (47) só valem para ramos de bens. Além disso, qualquer palavra significativa do objeto (5 letras
# ou mais) que apareça na descrição de um CNAE da empresa conta como compatível (correspondência por
# palavras), quando a tabela de CNAEs da Receita está no banco.
